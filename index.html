<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phylactère</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Phylactère">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0B0E1A; --nuit-p:#10152A; --encre:#141A2C; --encre-c:#1A2136;
  --trait:#2E3858; --trait-d:#1F2640; --ivoire:#F3EBDD; --ivoire-d:#C9CEDF;
  --brume:#9AA3BF; --or:#E3B65C; --bleu:#8792BC; --corail:#E8A48A;
  --serif:'Fraunces', Georgia, serif; --sans:'Manrope', system-ui, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--nuit);color:var(--ivoire);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--or)}
.app{display:flex;height:100%;padding-top:var(--safe-t)}
/* Navigation */
nav.rail{width:88px;flex:none;border-right:1px solid var(--trait-d);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px}
.logo span{font-family:var(--serif);font-size:13px;color:var(--ivoire-d);letter-spacing:.02em}
.nav-b{width:68px;padding:10px 0 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--brume);font-size:11.5px;font-weight:600}
.nav-b svg{width:22px;height:22px}
.nav-b[aria-current="true"]{color:var(--or);background:var(--encre)}
.nav-b:hover{color:var(--ivoire)}
.plus-or{width:30px;height:30px;border-radius:50%;background:var(--or);color:var(--nuit);display:grid;place-items:center;font-size:21px;font-weight:600;line-height:1}
/* Édition */
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-size:12.5px;color:var(--brume);font-weight:600}
.form .deux{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .trois{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.inp{width:100%;background:var(--encre);color:var(--ivoire);border:1px solid var(--trait);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;font-weight:400}
.inp:focus{outline:0;border-color:var(--brume)}
textarea.inp{resize:vertical;min-height:90px;line-height:1.5}
input[type=date].inp{color-scheme:dark}
.choix{display:flex;gap:6px;flex-wrap:wrap}
.note-choix button{font-size:22px;color:var(--trait);padding:0 2px;line-height:1}
.note-choix button.on{color:var(--or)}
.barre-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--nuit) 30%);padding:18px 0 4px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn.danger{border-color:rgba(232,164,138,.5);color:var(--corail)}
.mini-x{color:var(--brume);font-size:15px;padding:2px 6px}
.mini-x:hover{color:var(--corail)}
.modif{position:absolute;top:calc(10px + var(--safe-t));right:54px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--trait);display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ivoire-d);background:var(--nuit)}
.modif:hover{border-color:var(--or);color:var(--or)}
.resultat-isbn{display:flex;gap:14px;align-items:flex-start;margin-top:14px}
#scanner{position:fixed;inset:0;z-index:60;background:var(--nuit);display:none;flex-direction:column;padding:calc(12px + var(--safe-t)) 16px calc(14px + var(--safe-b))}
#scanner.ouvert{display:flex}
.sc-haut{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sc-video{position:relative;flex:1;min-height:200px;border-radius:16px;overflow:hidden;background:#000}
.sc-video video{width:100%;height:100%;object-fit:cover;display:block}
.sc-cadre{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.sc-cadre i{width:84%;height:40%;border:2px solid var(--or);border-radius:12px;box-shadow:0 0 0 999px rgba(5,7,14,.45)}
.sc-liste{max-height:30vh;overflow-y:auto;margin-top:12px;display:grid;gap:6px;font-size:14px}
.sc-item{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--encre)}
.sc-bas{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.fil-zone{position:relative;margin-top:18px}
.fil-mois{position:absolute;left:0;width:60px;font-size:11px;letter-spacing:.1em;color:var(--brume);font-weight:600}
.fil-mois::after{content:"";position:absolute;left:64px;top:7px;width:var(--larg);border-top:1px solid var(--trait-d)}
.fil-axe{position:absolute;left:66px;top:0;bottom:0;border-left:1px solid var(--trait)}
.fil-jour{position:absolute;left:58px;width:18px;height:18px;border-radius:50%;background:var(--or);box-shadow:0 0 0 5px rgba(227,182,92,.18)}
.fil-seg{position:absolute;text-align:left;border-radius:10px;background:var(--encre);border:1px solid var(--trait-d);border-left:3px solid var(--ivoire-d);padding:8px 10px;overflow:hidden;display:flex;gap:9px}
.fil-seg:hover{border-color:var(--trait);background:var(--encre-c)}
.fil-seg.en-cours{border-left-color:var(--or)}
.fil-seg .couv{--w:30px;width:30px;align-self:flex-start}
.fil-seg b{font-family:var(--serif);font-weight:400;font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fil-seg small{display:block;font-size:11.5px;color:var(--brume);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.astuce[hidden]{display:none}
.astuce{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--brume)}
.porte{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--trait-d)}
.porte:first-of-type{border-top:0}
#recadreur{position:fixed;inset:0;z-index:70;background:var(--nuit);display:flex;flex-direction:column;padding:calc(12px + var(--safe-t)) 16px calc(14px + var(--safe-b))}
.rc-scene{flex:1;display:grid;place-items:center;min-height:200px;overflow:hidden}
.rc-boite{position:relative;touch-action:none}
.rc-boite canvas{display:block;border-radius:4px}
.rc-cadre{position:absolute;border:2px solid var(--or);box-shadow:0 0 0 9999px rgba(5,7,14,.6);cursor:move;touch-action:none}
.rc-cadre i{position:absolute;width:22px;height:22px;border:3px solid var(--or);background:transparent}
.rc-cadre i[data-c=nw]{left:-4px;top:-4px;border-right:0;border-bottom:0;cursor:nwse-resize}
.rc-cadre i[data-c=ne]{right:-4px;top:-4px;border-left:0;border-bottom:0;cursor:nesw-resize}
.rc-cadre i[data-c=sw]{left:-4px;bottom:-4px;border-right:0;border-top:0;cursor:nesw-resize}
.rc-cadre i[data-c=se]{right:-4px;bottom:-4px;border-left:0;border-top:0;cursor:nwse-resize}
.edition{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:10px;border:1px solid var(--trait-d);margin-top:6px}
.edition:hover{border-color:var(--or)}
/* cartes du ciel en transparence : la carte reste visible dessous */
.bulle-etoile .carte,.terre .carte{background:rgba(20,26,44,.42)!important;border-color:rgba(154,163,191,.28)!important;box-shadow:none!important;-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px)}
.bulle-etoile .carte *,.terre .carte *{text-shadow:0 1px 3px rgba(11,14,26,.95),0 0 8px rgba(11,14,26,.7)}
.bulle-etoile .btn.or,.terre .btn.or,.bulle-etoile .btn.or *,.terre .btn.or *{text-shadow:none}
.bulle-etoile .relies button,.terre .btn:not(.or),.bulle-etoile .btn:not(.or){background:rgba(11,14,26,.35)}
.bulle-etoile .ligne:hover{background:rgba(20,26,44,.5)}
.pastille-export{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--or);margin-left:6px;vertical-align:middle}
main{flex:1;min-width:0;position:relative;overflow:hidden}
.vue{position:absolute;inset:0;overflow-y:auto;display:none}
.vue.active{display:block}
#vue-ciel{overflow:hidden}
@media (max-width:820px){
  .form .deux{grid-template-columns:1fr 1fr}
  .app{flex-direction:column}
  nav.rail{order:2;width:100%;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--trait-d);padding:6px 0 calc(6px + var(--safe-b));background:var(--nuit)}
  .logo{display:none}
  .nav-b{width:auto;flex:1;max-width:96px}
}
/* Commun */
.page{max-width:980px;margin:0 auto;padding:22px 20px 60px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:20px}
.sur{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brume);font-weight:600}
.doux{color:var(--brume)}
.carte{background:var(--encre);border:1px solid var(--trait-d);border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--trait);color:var(--ivoire);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--brume)}
.btn.or{background:var(--or);color:var(--nuit);border-color:var(--or)}
.btn.or:hover{filter:brightness(1.08)}
.btn.petit{padding:6px 12px;font-size:13px}
.puce{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--trait);font-size:13px;color:var(--ivoire-d);font-weight:500;white-space:nowrap}
.puce[aria-pressed="true"]{border-color:var(--or);color:var(--or);background:rgba(227,182,92,.08)}
.puce.mot{cursor:pointer}
.puce.mot:hover{border-color:var(--brume);color:var(--ivoire)}
.etoiles{color:var(--or);letter-spacing:1px;font-size:13px}
.statut{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ivoire-d)}
.statut i{width:8px;height:8px;border-radius:50%;display:inline-block}
.s-LU i{background:var(--ivoire)} .s-EN_COURS i{background:var(--or)} .s-A_LIRE i{border:1.5px solid var(--bleu)}
/* Couverture */
.couv{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--encre-c);flex:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.couv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.couv .dessin{position:absolute;inset:0;background:var(--encre);border:1px solid var(--trait);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10%;text-align:center;gap:6%}
.couv .dessin b{font-family:var(--serif);font-weight:400;color:var(--ivoire);line-height:1.15;font-size:calc(var(--w,90px) * .13)}
.couv .dessin small{color:var(--brume);font-size:calc(var(--w,90px) * .09)}
.couv .dessin svg{width:22%;height:auto}

/* Accueil vide */
.vide{max-width:560px;margin:8vh auto;padding:24px;text-align:center}
.vide p{color:var(--ivoire-d);line-height:1.6}
.depot{margin-top:22px;border:1px dashed var(--trait);border-radius:18px;padding:28px 18px}
.depot.survol{border-color:var(--or);background:rgba(227,182,92,.05)}
/* Ciel */
#ciel{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#ciel.tire{cursor:grabbing}
.ciel-tete{position:absolute;left:0;right:0;top:0;padding:16px 20px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:linear-gradient(var(--nuit) 30%,transparent)}
.ciel-tete>*{pointer-events:auto}
.ciel-tete h1{font-size:24px}
.banniere[hidden]{display:none}
.banniere{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;border:1px solid rgba(227,182,92,.5);color:var(--or);font-size:12.5px;font-weight:600}
.ciel-outils{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.rond{width:42px;height:42px;border-radius:50%;background:var(--encre);border:1px solid var(--trait);display:grid;place-items:center;font-size:18px;color:var(--ivoire-d)}
.rond:hover{color:var(--ivoire);border-color:var(--brume)}
.legende{position:absolute;left:20px;bottom:18px;display:flex;gap:14px;font-size:12px;color:var(--brume);pointer-events:none}
.bulle-etoile{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(440px,calc(100% - 32px));display:none;z-index:3}
.bulle-etoile.ouverte{display:block}
.bulle-etoile .carte{display:flex;gap:14px;align-items:flex-start;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.bulle-etoile h3{font-size:18px;line-height:1.2}
.relies{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.relies button{font-size:12.5px;color:var(--or);border:1px solid rgba(227,182,92,.35);border-radius:999px;padding:4px 10px}
.terre{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(480px,calc(100% - 32px));display:none;z-index:3}
.terre.ouverte{display:block}
@media (max-width:820px){.legende{display:none}.ciel-outils{bottom:14px;right:12px}}
/* Chercher */
.recherche{display:flex;gap:10px;align-items:center;margin:16px 0 14px}
.champ{flex:1;display:flex;align-items:center;gap:10px;background:var(--encre);border:1px solid var(--trait);border-radius:999px;padding:0 16px}
.champ input{flex:1;background:none;border:0;outline:0;color:var(--ivoire);font:inherit;padding:12px 0}
.champ:focus-within{border-color:var(--brume)}
.filtres{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.etagere{margin:26px 0 0}
.etagere-tete{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.etagere-tete h2{font-size:19px}
.etagere-tete h2 small{font-family:var(--sans);font-size:12.5px;color:var(--brume);margin-left:8px}
.rangee{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--trait) transparent}
.livre-v{width:96px;flex:none;text-align:left;scroll-snap-align:start}
.livre-v .couv{--w:96px;width:96px}
.livre-v .t{font-size:12.5px;line-height:1.3;margin-top:8px;color:var(--ivoire-d);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.livre-v:hover .t{color:var(--ivoire)}
.section-lettre{font-family:var(--serif);font-size:22px;color:var(--or);margin:22px 0 6px;font-style:italic}
.ligne{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px}
.ligne:hover{background:var(--encre)}
.ligne .couv{--w:46px;width:46px}
.ligne .infos{flex:1;min-width:0}
.ligne .t{font-family:var(--serif);font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .a{font-size:13px;color:var(--brume);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ligne .d{display:flex;gap:12px;align-items:center;margin-top:5px;font-size:12px;color:var(--brume)}
.select{background:var(--encre);color:var(--ivoire);border:1px solid var(--trait);border-radius:999px;padding:9px 14px;font:inherit;font-size:13.5px}
/* Fiche */
.voile{position:fixed;inset:0;background:rgba(5,7,14,.55);z-index:20;display:none}
.voile.ouvert{display:block}
.fiche{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--nuit);border-left:1px solid var(--trait-d);z-index:21;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:var(--safe-t)}
.fiche.ouverte{transform:none}
.fiche-tete{padding:58px 20px 0;display:flex;gap:18px}
.fiche-tete .couv{--w:112px;width:112px}
.fiche-tete h2{font-size:24px;line-height:1.15}
.fiche-tete .a{color:var(--ivoire-d);margin-top:6px}
.fiche-tete .meta{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;align-items:center;font-size:12.5px;color:var(--brume)}
.fermer{position:absolute;top:calc(10px + var(--safe-t));right:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--brume);font-size:20px;background:var(--nuit)}
.fermer:hover{color:var(--ivoire)}
.onglets{display:flex;gap:4px;padding:16px 16px 0;border-bottom:1px solid var(--trait-d);overflow-x:auto;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglet{padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--brume);border-bottom:2px solid transparent;white-space:nowrap}
.onglet[aria-selected="true"]{color:var(--ivoire);border-color:var(--or)}
.onglet sup{color:var(--or);font-size:10px;margin-left:2px}
.fiche-corps{flex:1;overflow-y:auto;padding:18px 20px calc(40px + var(--safe-b))}
.texte{line-height:1.65;color:var(--ivoire-d);white-space:pre-wrap;font-size:14.5px}
.texte .spoil{filter:blur(5px);cursor:pointer;transition:filter .2s}
.texte .spoil.vu{filter:none}
.citation{border-left:2px solid var(--or);padding:4px 0 4px 14px;margin:0 0 18px;font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.5;color:var(--ivoire)}
.citation small{display:block;font-family:var(--sans);font-style:normal;font-size:12px;color:var(--brume);margin-top:6px}
.grille-info{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:14px}
.grille-info dt{color:var(--brume)}
.grille-info dd{margin:0}
.barre{height:6px;border-radius:3px;background:var(--trait-d);overflow:hidden;margin:8px 0 4px}
.barre i{display:block;height:100%;background:var(--or);border-radius:3px}
.proche{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--trait-d);margin-bottom:8px}
.proche:hover{border-color:var(--trait);background:var(--encre)}
.proche .couv{--w:40px;width:40px}
.proche .r{font-size:12.5px;color:var(--brume);margin-top:3px}
.bloc{margin-bottom:24px}
.bloc>.sur{margin-bottom:10px;display:block}
.liens-ext{display:flex;flex-wrap:wrap;gap:8px}
.liens-ext a{text-decoration:none}
/* Carnet */
.cit-carte{margin-bottom:14px}
.cit-carte button{color:var(--brume);font-size:12.5px;margin-top:6px}
.cit-carte button:hover{color:var(--or)}
/* Réglages */
.reglage{margin-top:16px}
.reglage h2{font-size:18px;margin-bottom:6px}
.reglage p{color:var(--ivoire-d);line-height:1.55;margin:6px 0 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--encre-c);border:1px solid var(--trait);padding:10px 16px;border-radius:999px;font-size:13.5px;transition:.25s;z-index:40;pointer-events:none}
.toast.vu{opacity:1;transform:translateX(-50%)}
.dialogue{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(5,7,14,.6);padding:20px}
.dialogue.ouvert{display:grid}
.dialogue .carte{max-width:420px}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.fiche{transition:none}}
</style>
</head>
<body>

/* ---------------- Stockage local (IndexedDB) ---------------- */
const Base = {
  db: null,
  async ouvrir(){
    if (this.db) return this.db;
    this.db = await new Promise((ok, ko) => {
      const r = indexedDB.open('phylactere', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('donnees'); r.result.createObjectStore('couvertures'); };
      r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
    });
    return this.db;
  },
  async tx(store, mode, fn){
    const db = await this.ouvrir();
    return new Promise((ok, ko) => { const t = db.transaction(store, mode); const res = fn(t); t.oncomplete = () => ok(res && res.result !== undefined ? res.result : res); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); });
  },
  async lire(){
    try { const db = await this.ouvrir(); return await new Promise((ok, ko) => { const r = db.transaction('donnees', 'readonly').objectStore('donnees').get('racine'); r.onsuccess = () => ok(r.result || null); r.onerror = () => ko(r.error); }); }
    catch(e){ console.warn(e); return null; }
  },
  async couvertures(){
    try {
      const db = await this.ouvrir();
      return await new Promise((ok, ko) => { const m = new Map(); const t = db.transaction('couvertures','readonly'); const c = t.objectStore('couvertures').openCursor(); c.onsuccess = () => { const k = c.result; if (k) { m.set(k.key, k.value); k.continue(); } }; t.oncomplete = () => ok(m); t.onerror = () => ko(t.error); });
    } catch(e){ return new Map(); }
  },
  async remplacer(racine, fichiers){
    const db = await this.ouvrir();
    await new Promise((ok, ko) => {
      const t = db.transaction(['donnees','couvertures'], 'readwrite');
      t.objectStore('donnees').put(racine, 'racine');
      const s = t.objectStore('couvertures'); s.clear();
      for (const [nom, blob] of fichiers) s.put(blob, nom);
      t.oncomplete = ok; t.onerror = () => ko(t.error); t.onabort = () => ko(t.error);
    });
  },
  async ecrireDonnees(racine){ await this.tx('donnees','readwrite', t => t.objectStore('donnees').put(racine, 'racine')); },
  async ecrireCouverture(nom, blob){ await this.tx('couvertures','readwrite', t => t.objectStore('couvertures').put(blob, nom)); },
  async supprimerCouverture(nom){ await this.tx('couvertures','readwrite', t => t.objectStore('couvertures').delete(nom)); },
  async lireCouverture(nom){ const db = await this.ouvrir(); return new Promise((ok, ko) => { const r = db.transaction('couvertures', 'readonly').objectStore('couvertures').get(nom); r.onsuccess = () => ok(r.result || null); r.onerror = () => ko(r.error); }); },
  async effacer(){ const db = await this.ouvrir(); await new Promise((ok, ko) => { const t = db.transaction(['donnees','couvertures'],'readwrite'); t.objectStore('donnees').clear(); t.objectStore('couvertures').clear(); t.oncomplete = ok; t.onerror = () => ko(t.error); }); }
};

/* ---------------- Lecture du .zip de sauvegarde (sans bibliothèque) ---------------- */
async function lireZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let fin = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { fin = i; break; }
  if (fin < 0) throw new Error('Ce fichier n’est pas un .zip lisible');
  const n = dv.getUint16(fin + 10, true); let p = dv.getUint32(fin + 16, true);
  const entrees = [];
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const methode = dv.getUint16(p + 10, true), taille = dv.getUint32(p + 20, true);
    const ln = dv.getUint16(p + 28, true), le = dv.getUint16(p + 30, true), lc = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const nom = dec.decode(u8.subarray(p + 46, p + 46 + ln));
    entrees.push({ nom, methode, taille, local });
    p += 46 + ln + le + lc;
  }
  const lire = async e => {
    const d = e.local + 30 + dv.getUint16(e.local + 26, true) + dv.getUint16(e.local + 28, true);
    const brut = u8.slice(d, d + e.taille);
    if (e.methode === 0) return brut.buffer;
    if (e.methode !== 8) throw new Error('Compression non prise en charge');
    return new Response(new Blob([brut]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
  };
  return { entrees, lire };
}

async function importerSauvegarde(fichier){
  const zip = await lireZip(await fichier.arrayBuffer());
  const json = zip.entrees.find(e => e.nom === 'donnees.json');
  if (!json) throw new Error('Ce fichier n’est pas une sauvegarde Phylactère');
  const racine = JSON.parse(new TextDecoder().decode(await zip.lire(json)));
  if (racine.application !== 'Phylactère') throw new Error('Ce fichier n’est pas une sauvegarde Phylactère');
  const fichiers = [];
  for (const e of zip.entrees) {
    if (!e.nom.startsWith('couvertures/') || e.nom.endsWith('/')) continue;
    const nom = e.nom.split('/').pop();
    const type = /\.png$/i.test(nom) ? 'image/png' : /\.webp$/i.test(nom) ? 'image/webp' : 'image/jpeg';

/* ---------------- Modèle en mémoire ---------------- */

async function charger(){

}

    }
    if (pointeurs.size === 2) { const [a, b] = [...pointeurs.values()]; geste = { type:'pince', d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], vue:{ ...vue } }; }
    cv.classList.add('tire');
  });
  cv.addEventListener('pointermove', e => {
    if (!pointeurs.has(e.pointerId)) { const v = viser(e.offsetX, e.offsetY); cv.style.cursor = v ? 'pointer' : 'grab'; return; }
    pointeurs.set(e.pointerId, [e.offsetX, e.offsetY]); anim = null;
    if (geste?.type === 'lampe') { lampe = { x: e.offsetX, y: e.offsetY, fin: 0 }; sale = true; return; }
    if (geste?.type === 'glisse' && pointeurs.size === 1) {
      const dx = e.offsetX - geste.dep[0], dy = e.offsetY - geste.dep[1]; deplace = Math.max(deplace, Math.hypot(dx, dy));
      if (deplace > 4) { vue = { ...geste.vue, x: geste.vue.x - dx / vue.z, y: geste.vue.y - dy / vue.z }; bouge = true; sale = true; }
    } else if (geste?.type === 'pince' && pointeurs.size === 2) {
      const [a, b] = [...pointeurs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const z = Math.min(12, Math.max(.25, geste.vue.z * d / geste.d));
      const w = [(geste.m[0] - L / 2) / geste.vue.z + geste.vue.x, (geste.m[1] - H / 2) / geste.vue.z + geste.vue.y];
      vue = { z, x: w[0] - (m[0] - L / 2) / z, y: w[1] - (m[1] - H / 2) / z }; deplace = 99; bouge = true; sale = true;
    }
  });
  const fin = e => {
    clearTimeout(minuterieLampe);
    if (geste?.type === 'lampe') { if (lampe) lampe.fin = performance.now(); pointeurs.delete(e.pointerId); cv.classList.remove('tire'); geste = null; return; }
    const etaitSeul = pointeurs.size === 1 && geste?.type === 'glisse';
    pointeurs.delete(e.pointerId); cv.classList.remove('tire');
    if (etaitSeul && deplace <= 4 && e.type === 'pointerup') clic(e.offsetX, e.offsetY);
    if (pointeurs.size === 1) { const [p] = [...pointeurs.values()]; geste = { type:'glisse', dep:p, vue:{ ...vue } }; deplace = 99; } else if (!pointeurs.size) geste = null;
  };
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
  let dernierClic = 0;
  function clic(x, y){
    const now = performance.now();
    if (now - dernierClic < 300) { zoomer(2, x, y); dernierClic = 0; return; }
    dernierClic = now;
    const v = viser(x, y);
    if (v?.etoile) choisir(v.etoile);
    else if (v?.k) allumer(v.k);
    else if (v?.eteint) ouvrirTerre(v.eteint);
    else { if (choisie) { choisie = null; fermerBulle(); } if (terre) fermerTerre(); eteindre(); sale = true; }
  }
  function zoomer(f, sx = L / 2, sy = H / 2, anime = true){
    const z = Math.min(12, Math.max(.25, vue.z * f)); const w = monde(sx, sy);
    const cible = { z, x: w[0] - (sx - L / 2) / z, y: w[1] - (sy - H / 2) / z }; bouge = true;
    if (anime && !reduitMouvement) animerVers(cible, 260); else { vue = cible; sale = true; }
  }
  cv.addEventListener('wheel', e => { e.preventDefault(); anim = null; zoomer(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018)), e.offsetX, e.offsetY, false); }, { passive:false });
  $('#zoom-plus').onclick = () => zoomer(1.6); $('#zoom-moins').onclick = () => zoomer(1 / 1.6);
  $('#recadrer').onclick = () => { allume = null; choisie = null; fermerBulle(); fermerTerre(); cadrer(modele.consts, 3, true); };
  $('#ciel-banniere').onclick = () => { Chercher.filtre = 'COMPLETER'; Chercher.mode = 'liste'; location.hash = 'chercher'; };
  addEventListener('keydown', e => { if (vueCourante !== 'ciel' || Fiche.estOuverte()) return; if (e.key === 'Escape') clic(-999, -999); if (e.key === '+' || e.key === '=') zoomer(1.4); if (e.key === '-') zoomer(1 / 1.4); });
  new ResizeObserver(() => taille()).observe(cv);
  requestAnimationFrame(boucle);
  if (document.fonts) document.fonts.ready.then(() => { sale = true; });

  return { invalider, activer(){ taille(); sale = true; }, choisirLivre(id){ if (!modele) return; const e = modele.parLivre.get(id); if (e) { allume = null; if (!e.groupe) animerVers({ x: e.wx, y: e.wy, z: Math.max(vue.z, 2) }, 500); choisir(e); } } };
})();

/* =========================================================
   Chercher : étagères et liste
   ========================================================= */
const Chercher = {
  mode: 'etageres', filtre: 'TOUS', tri: 'ajout', requete: '', limite: null,
  reinit(){ this.mode = 'etageres'; this.filtre = 'TOUS'; this.requete = ''; this.limite = null; },
  rendre(){
    const el = $('#chercher');
    el.innerHTML = `<h1>Chercher</h1>
      <div class="recherche"><label class="champ"><span class="doux">⌕</span><input id="q" type="search" placeholder="Titre, auteur, série, mot-clé…" value="${esc(this.requete)}" autocomplete="off"></label>
      <div class="filtres" style="padding:0"><button class="puce" data-mode="etageres" aria-pressed="${this.mode === 'etageres' && !this.requete}">Étagères</button><button class="puce" data-mode="liste" aria-pressed="${this.mode === 'liste' || !!this.requete}">Liste</button></div></div>
      <div id="resultats"></div>`;
    const q = $('#q');
    q.addEventListener('input', () => { this.requete = q.value; this.limite = null; this.resultats(); el.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === (this.requete ? 'liste' : this.mode)))); });
    el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { this.mode = b.dataset.mode; this.requete = ''; this.limite = null; this.rendre(); });
    this.resultats();
  },
  resultats(){
    const r = $('#resultats');
    if (this.mode === 'etageres' && !this.requete) { r.innerHTML = this.etageres(); }
    else r.innerHTML = this.liste();
    r.querySelectorAll('[data-livre]').forEach(b => b.onclick = () => Fiche.ouvrir(+b.dataset.livre));
    r.querySelectorAll('[data-etagere]').forEach(b => b.onclick = () => { this.limite = JSON.parse(b.dataset.etagere); this.mode = 'liste'; this.filtre = 'TOUS'; this.rendre(); scrollTo(0, 0); });
    r.querySelectorAll('[data-filtre]').forEach(b => b.onclick = () => { this.filtre = b.dataset.filtre; this.resultats(); });
    r.querySelectorAll('[data-sortir]').forEach(b => b.onclick = () => { this.limite = null; this.resultats(); });
    const s = r.querySelector('#tri'); if (s) s.onchange = () => { this.tri = s.value; this.resultats(); };
  },
  etagere(titre, livres, limite, sous = ''){
    if (!livres.length) return '';
    return `<div class="etagere"><div class="etagere-tete"><h2>${esc(titre)}<small>${livres.length}${sous ? ' · ' + esc(sous) : ''}</small></h2><button class="btn petit" data-etagere='${esc(JSON.stringify({ ...limite, titre }))}'>Tout voir ›</button></div>
      <div class="rangee">${livres.slice(0, 30).map(l => `<button class="livre-v" data-livre="${l.id}">${couverture(l, 96)}<div class="t">${esc(titreCourt(l))}</div></button>`).join('')}</div></div>`;
  },
  etageres(){
    const L = M.lectures; const recents = (a, b) => (b.dateAjout || 0) - (a.dateAjout || 0);
    let h = '';
    h += this.etagere('En cours', L.filter(l => l.statut === 'EN_COURS').sort((a, b) => (b.dateDebut || 0) - (a.dateDebut || 0)), { statut:'EN_COURS' });
    h += this.etagere('À lire', L.filter(l => l.statut === 'A_LIRE').sort(recents), { statut:'A_LIRE' });
    h += this.etagere('Lus', L.filter(l => l.statut === 'LU').sort((a, b) => (b.dateFin || 0) - (a.dateFin || 0)), { statut:'LU' });
    h += this.etagere('À compléter', L.filter(l => l._manques.length), { completer:true });
    h += this.etagere('Sans couverture', L.filter(l => !l.couvertureUrl), { sansCouv:true });
    h += this.etagere('Prêtés', L.filter(l => l.pretA), { pretes:true });
    h += `<div class="sur" style="margin-top:36px">Tes constellations</div>`;
    const parTheme = new Map(); for (const l of L) if (l._theme) { if (!parTheme.has(l._theme)) parTheme.set(l._theme, []); parTheme.get(l._theme).push(l); }
    for (const [t, ls] of [...parTheme].sort((a, b) => b[1].length - a[1].length)) h += this.etagere(t, ls.sort(recents), { theme:t });
    const series = new Map(); for (const l of L) if (l.serie) { const k = norm(l.serie); if (!series.has(k)) series.set(k, { nom:l.serie, ls:[] }); series.get(k).ls.push(l); }
    const s2 = [...series.values()].filter(s => s.ls.length >= 2);
    if (s2.length) { h += `<div class="sur" style="margin-top:36px">Tes séries</div>`; for (const s of s2.sort((a, b) => b.ls.length - a.ls.length)) h += this.etagere(s.nom, s.ls.sort((a, b) => (a.tome ?? 99) - (b.tome ?? 99)), { serie:norm(s.nom) }); }
    const fils = this.fils();
    if (fils.length) { h += `<div class="sur" style="margin-top:36px">Tes fils <span style="text-transform:none;letter-spacing:0;font-weight:500">· mots partagés par plusieurs livres</span></div>`; for (const f of fils) h += this.etagere(f.mot, f.ls, { mot:f.cle }); }
    return h;
  },
  fils(){
    const m = new Map();
    for (const l of M.lectures) for (const w of l._mots) { const k = norm(w); if (!m.has(k)) m.set(k, { mot:w, cle:k, ls:[] }); m.get(k).ls.push(l); }
    return [...m.values()].filter(f => f.ls.length >= 4).sort((a, b) => b.ls.length - a.ls.length).slice(0, 8);
  },
  liste(){
    let ls = M.lectures.slice(); const lim = this.limite;
    if (lim) {
      if (lim.statut) ls = ls.filter(l => l.statut === lim.statut);
      if (lim.completer) ls = ls.filter(l => l._manques.length);
      if (lim.sansCouv) ls = ls.filter(l => !l.couvertureUrl);
      if (lim.pretes) ls = ls.filter(l => l.pretA);
      if (lim.theme) ls = ls.filter(l => l._theme === lim.theme);
      if (lim.serie) ls = ls.filter(l => norm(l.serie) === lim.serie);
      if (lim.mot) ls = ls.filter(l => l._motsN.has(lim.mot));
      if (lim.ids) ls = ls.filter(l => lim.ids.includes(l.id));
    }
    const f = this.filtre;
    if (f === 'COMPLETER') ls = ls.filter(l => l._manques.length);
    else if (['LU','EN_COURS','A_LIRE'].includes(f)) ls = ls.filter(l => l.statut === f);
    else if (f === 'BD' || f === 'LIVRE') ls = ls.filter(l => l.type === f);
    const q = norm(this.requete);
    if (q) { const mots = q.split(/\s+/); ls = ls.filter(l => { const tout = norm([l.titre, l.auteur, l.serie, l.theme, l.motsCles, l.isbn].join(' ')); return mots.every(m => tout.includes(m)); }); }
    const nb = c => M.lectures.filter(c).length;
    const puces = [['TOUS','Tous'],['EN_COURS','En cours'],['A_LIRE','À lire'],['LU','Lus'],['LIVRE','Livres'],['BD','BD'],['COMPLETER',`À compléter · ${nb(l => l._manques.length)}`]];
    let h = '';
    if (lim) h += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span class="sur">Étagère</span><h2 style="font-size:20px">${esc(lim.titre)}</h2><button class="btn petit" data-sortir>✕</button></div>`;
    h += `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><div class="filtres" style="flex:1;min-width:0">${puces.map(([k, t]) => `<button class="puce" data-filtre="${k}" aria-pressed="${f === k}">${esc(t)}</button>`).join('')}</div>
      <select class="select" id="tri" aria-label="Trier">${[['ajout','Date d’ajout'],['titre','Titre'],['auteur','Auteur'],['debut','Début de lecture'],['fin','Fin de lecture'],['theme','Thème'],['serie','Série'],['note','Note']].map(([k, t]) => `<option value="${k}" ${this.tri === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>`;
    if (f === 'COMPLETER') h += `<p class="doux" style="font-size:13.5px;line-height:1.5">Ces fiches n’entrent ni dans le ciel tant qu’il leur manque un titre, un auteur ou un thème. Leurs citations restent dans le carnet.</p>`;
    h += `<div class="doux" style="font-size:12.5px;margin:10px 0">${ls.length} livre${ls.length > 1 ? 's' : ''}</div>`;
    if (!ls.length) return h + `<p class="doux">Aucun livre ne correspond.</p>`;
    const tri = this.tri; let section = null;
    const cmp = {
      ajout: (a, b) => (b.dateAjout || 0) - (a.dateAjout || 0),
      titre: (a, b) => cleTitre(a).localeCompare(cleTitre(b), 'fr') || (a.tome ?? 0) - (b.tome ?? 0),
      auteur: (a, b) => norm(nomFamille(a) || '~').localeCompare(norm(nomFamille(b) || '~'), 'fr') || norm(a.serie || '').localeCompare(norm(b.serie || '')) || (a.tome ?? 0) - (b.tome ?? 0) || cleTitre(a).localeCompare(cleTitre(b), 'fr'),
      debut: (a, b) => (b.dateDebut || 0) - (a.dateDebut || 0),
      fin: (a, b) => (b.dateFin || 0) - (a.dateFin || 0),
      theme: (a, b) => (a._theme || '~').localeCompare(b._theme || '~', 'fr') || cleTitre(a).localeCompare(cleTitre(b), 'fr'),
      serie: (a, b) => norm(a.serie || '~~').localeCompare(norm(b.serie || '~~'), 'fr') || (a.tome ?? 0) - (b.tome ?? 0),
      note: (a, b) => (b.note || 0) - (a.note || 0) || cleTitre(a).localeCompare(cleTitre(b), 'fr')
    }[tri];
    ls.sort(cmp);
    const cleSection = l => tri === 'titre' ? (cleTitre(l)[0] || '#').toUpperCase() : tri === 'auteur' ? (premierAuteur(l) || 'Auteur inconnu') : tri === 'theme' ? (l._theme || 'Sans thème') : tri === 'serie' ? (l.serie || 'Hors série') : null;
    const comptes = new Map(); if (tri === 'auteur') for (const l of ls) { const k = cleSection(l); comptes.set(k, (comptes.get(k) || 0) + 1); }
    for (const l of ls) {
      const s = cleSection(l);
      if (s !== null && s !== section) { section = s; h += `<div class="section-lettre">${esc(s)}${comptes.get(s) ? ` <span class="doux" style="font-style:normal;font-size:14px;font-family:var(--sans)">(${comptes.get(s)})</span>` : ''}</div>`; }
      h += `<button class="ligne" data-livre="${l.id}">${couverture(l, 46)}<div class="infos"><div class="t">${esc(titreCourt(l))}</div><div class="a">${esc(l.auteur || '—')}${l.serie && !l.titre.includes(l.serie) ? ' · ' + esc(l.serie) : ''}</div>
        <div class="d">${pastille(l.statut)}${etoilesNote(l.note)}${l._theme ? `<span>${esc(l._theme)}</span>` : ''}${l._manques.length ? `<span style="color:var(--or)">Manque : ${l._manques.join(', ')}</span>` : ''}</div></div></button>`;
    }
    return h;
  }
};

/* =========================================================
   Fiche
   ========================================================= */
const Fiche = (() => {
  let ouverte = false, livre = null, onglet = null;
  const el = $('#fiche'), voile = $('#voile');
  function proches(l){
    const exclus = new Set([l.id, ...l._liens.map(x => x.id)]);
    const res = [];
    for (const o of M.lectures) {
      if (exclus.has(o.id)) continue;
      if (l.serie && o.serie && norm(l.serie) === norm(o.serie)) continue;
      const communs = l._mots.filter(w => o._motsN.has(norm(w)));
      let score = communs.length * 2, raisons = [];
      if (premierAuteur(l) && norm(premierAuteur(l)) === norm(premierAuteur(o))) { score += 3; raisons.push('même auteur'); }
      if (communs.length && l._theme && l._theme === o._theme) score += 1;
      if (communs.length) raisons.push((communs.length > 1 ? 'mots partagés : ' : 'mot partagé : ') + communs.slice(0, 4).join(', '));
      if (score >= 3) res.push({ o, score, raison: raisons.join(' · ') });
    }
    return res.sort((a, b) => b.score - a.score).slice(0, 5);
  }
  function memeSerie(l){ if (!l.serie) return []; return M.lectures.filter(o => o.id !== l.id && o.serie && norm(o.serie) === norm(l.serie)).sort((a, b) => (a.tome ?? 99) - (b.tome ?? 99)); }
  function texteNotes(t){
    // « [Spoiler] … » jusqu'à la fin de la ligne : flouté, révélé au toucher
    return esc(t).replace(/\[Spoiler\]([^\n]*)/gi, (_, s) => `<span class="doux">[Spoiler]</span><span class="spoil" title="Toucher pour révéler">${s}</span>`);
  }
  const ligneLivre = (o, r) => `<button class="proche" data-livre="${o.id}">${couverture(o, 40)}<div style="flex:1;min-width:0"><div style="font-family:var(--serif);font-size:15.5px">${esc(titreCourt(o))}</div><div class="doux" style="font-size:12.5px">${esc(o.auteur)}</div>${r ? `<div class="r">${esc(r)}</div>` : ''}</div></button>`;
  function corps(l, nom){
    if (nom === 'lecture') {
      const p = l.pagesTotal && l.pageActuelle != null ? Math.min(100, Math.round(l.pageActuelle / l.pagesTotal * 100)) : null;
      const duree = l.dateDebut && l.dateFin ? Math.max(1, Math.round((l.dateFin - l.dateDebut) / 864e5)) : null;
      return `${p != null ? `<div class="bloc"><span class="sur">Progression</span><div class="barre"><i style="width:${p}%"></i></div><div class="doux" style="font-size:13px">Page ${l.pageActuelle} sur ${l.pagesTotal} · ${p} %</div></div>` : ''}
        <dl class="grille-info bloc">
          <dt>Statut</dt><dd>${pastille(l.statut)}</dd>
          ${l.note ? `<dt>Note</dt><dd>${etoilesNote(l.note)}</dd>` : ''}
          ${l.dateDebut ? `<dt>Commencé</dt><dd>${date(l.dateDebut)}</dd>` : ''}
          ${l.dateFin ? `<dt>Terminé</dt><dd>${date(l.dateFin)}${duree ? ` <span class="doux">· ${duree} jour${duree > 1 ? 's' : ''}</span>` : ''}</dd>` : ''}
          ${l.relectures ? `<dt>Relectures</dt><dd>${l.relectures}</dd>` : ''}
          ${l.pretA ? `<dt>Prêté à</dt><dd>${esc(l.pretA)}${l.pretDepuis ? ` <span class="doux">depuis le ${date(l.pretDepuis)}</span>` : ''}</dd>` : ''}
          <dt>Ajouté</dt><dd>${date(l.dateAjout) || '—'}</dd>
        </dl>`;
    }
    if (nom === 'notes') return l.notes ? `<div class="texte">${texteNotes(l.notes)}</div>` : `<p class="doux">Pas encore de notes sur ce livre.</p>`;
    if (nom === 'citations') {
      const cs = M.citations.filter(c => c.lectureId === l.id).sort((a, b) => (a.page ?? 1e9) - (b.page ?? 1e9) || a.dateAjout - b.dateAjout);
      return cs.length ? cs.map(c => `<blockquote class="citation">« ${esc(c.texte)} »<small>${c.page ? 'p. ' + c.page + ' · ' : ''}${date(c.dateAjout)} <button class="mini-x" data-supcit="${c.id}" aria-label="Supprimer la citation">✕</button></small></blockquote>`).join('') : `<p class="doux">Aucune citation gardée pour ce livre.</p>`;
    }
    if (nom === 'livre') {
      const a = premierAuteur(l), ddg = q => 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      return `${l.resume ? `<div class="bloc"><span class="sur">4e de couverture${l.sourceResume ? ' · ' + esc(l.sourceResume) : ''}</span><div class="texte">${esc(l.resume)}</div></div>` : ''}
        ${l._mots.length ? `<div class="bloc"><span class="sur">Mots-clés</span><div style="display:flex;flex-wrap:wrap;gap:6px">${l._mots.map(w => `<button class="puce mot" data-mot="${esc(norm(w))}" data-label="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>` : ''}
        <dl class="grille-info bloc">
          <dt>Type</dt><dd>${l.type === 'BD' ? 'Bande dessinée' : 'Livre'}</dd>
          ${l._theme ? `<dt>Thème</dt><dd>${esc(l._theme)}</dd>` : ''}
          ${l.serie ? `<dt>Série</dt><dd>${esc(l.serie)}${l.tome ? ' · tome ' + l.tome : ''}</dd>` : ''}
          ${l.pagesTotal ? `<dt>Pages</dt><dd>${l.pagesTotal}</dd>` : ''}
          ${l.isbn ? `<dt>ISBN</dt><dd>${esc(l.isbn)}</dd>` : ''}
        </dl>
        <div class="bloc"><span class="sur">Ailleurs</span><div class="liens-ext">
          <a class="btn petit" href="${ddg('!ducky site:babelio.com/livres ' + l.titre + ' ' + a)}" target="_blank" rel="noopener">Babelio ↗</a>
          ${l.type === 'BD' ? `<a class="btn petit" href="${ddg('!ducky site:bedetheque.com ' + (l.serie || l.titre) + ' ' + a)}" target="_blank" rel="noopener">Bédéthèque ↗</a>` : ''}
          ${a ? `<a class="btn petit" href="https://www.literature-map.com/${encodeURIComponent(a.toLowerCase()).replace(/%20/g, '+')}" target="_blank" rel="noopener">Literature-Map ↗</a>` : ''}
        </div></div>`;
    }
    if (nom === 'proches') {
      const liens = l._liens.map(x => ({ o: M.parId.get(x.id), r: x.raison })).filter(x => x.o);
      const serie = memeSerie(l), pr = proches(l);
      let h = '';

/* =========================================================
   Fil du temps (même calcul que FilCalcul.kt) : aujourd'hui en haut, le passé vers le bas
   ========================================================= */
const Fil = {
  rendre(){
    const el = $('#fil'), J = 864e5, maintenant = Date.now(), annee = new Date().getFullYear();
    const court = ms => { const d = new Date(ms); return `${d.getDate()} ${MOIS[d.getMonth()]}${d.getFullYear() !== annee ? ' ' + d.getFullYear() : ''}`; };
    const jours = (a, b) => Math.round((b - a) / J);
    const livres = M.lectures.filter(l => !l._manques.length);
    const iv = [];
    for (const l of livres) {
      const enCours = l.statut === 'EN_COURS';
      const fin = enCours ? maintenant : (l.dateFin ?? l.dateDebut);
      if (fin == null) continue;
      iv.push({ l, debut: Math.min(l.dateDebut ?? fin, fin), fin, enCours });
    }
    const sansDates = livres.length - iv.length;
    const termines = livres.filter(l => l.statut === 'LU' && l.dateFin);
    const durees = livres.filter(l => l.statut === 'LU' && l.dateDebut && l.dateFin).map(l => Math.max(1, jours(l.dateDebut, l.dateFin)));
    const stats = [`${termines.filter(l => new Date(l.dateFin).getFullYear() === annee).length} terminé${termines.length > 1 ? 's' : ''} cette année`, `${livres.filter(l => l.statut === 'EN_COURS').length} en cours`];
    if (durees.length) stats.push(`${Math.round(durees.reduce((a, b) => a + b, 0) / durees.length)} jours par livre en moyenne`);
    let h = `<h1>Fil du temps</h1><p class="doux" style="margin:6px 0 0">${stats.join(' · ')}</p>`;
    if (sansDates) h += `<p class="doux" style="font-size:13px;margin:6px 0 0">${sansDates} lecture${sansDates > 1 ? 's' : ''} sans date ne figure${sansDates > 1 ? 'nt' : ''} pas sur le fil.</p>`;
    if (!iv.length) { el.innerHTML = h + '<p class="doux" style="margin-top:30px">Aucune lecture datée pour l’instant.</p>'; return; }
    const HAUT = 30, MIN = 78, ESP = 8, LARG = innerWidth < 600 ? 150 : 190, GAUCHE = innerWidth < 600 ? 74 : 84;
    const ancien = Math.min(...iv.map(x => x.debut)), etendue = Math.max(1, jours(ancien, maintenant));
    const pj = etendue <= 120 ? 5 : etendue <= 400 ? 3.5 : 2;
    const y = ms => HAUT + (maintenant - ms) / J * pj;
    const voies = [], segs = [];
    for (const x of iv.sort((a, b) => y(a.fin) - y(b.fin) || a.l.id - b.l.id)) {
      const haut = y(x.fin), duree = jours(x.debut, x.fin), hauteur = Math.max(MIN, duree * pj);
      let v = voies.findIndex(f => f + ESP <= haut); if (v < 0) { voies.push(haut + hauteur); v = voies.length - 1; } else voies[v] = haut + hauteur;
      const l = x.l, pc = l.pagesTotal && l.pageActuelle != null ? ` · ${Math.min(100, Math.round(l.pageActuelle * 100 / l.pagesTotal))} %` : '';
      const dates = x.enCours ? (l.dateDebut ? 'depuis le ' + court(l.dateDebut) : 'en cours') : l.dateDebut && l.dateFin ? `${court(l.dateDebut)} → ${court(l.dateFin)}` : l.dateFin ? 'terminé le ' + court(l.dateFin) : 'commencé le ' + court(x.debut);
      const etat = x.enCours ? `En cours · ${Math.max(1, duree)} j${pc}` : l.dateDebut && l.dateFin ? `${Math.max(1, duree)} jour${duree > 1 ? 's' : ''}` : STATUTS[l.statut];
      segs.push({ l, haut, hauteur, v, dates, etat, enCours: x.enCours });
    }
    const total = Math.max(...segs.map(s => s.haut + s.hauteur)) + 40, larg = GAUCHE + voies.length * (LARG + 10);
    let mois = '', d = new Date(new Date().getFullYear(), new Date().getMonth(), 1); const lim = new Date(new Date(ancien).getFullYear(), new Date(ancien).getMonth(), 1);
    const premier = d.getTime();
    while (d >= lim) { const nom = MOIS[d.getMonth()].replace('.', '').toUpperCase(); mois += `<div class="fil-mois" style="top:${y(d.getTime()) - 7}px">${nom}${d.getMonth() === 0 || d.getTime() === premier ? ' ' + d.getFullYear() : ''}</div>`; d = new Date(d.getFullYear(), d.getMonth() - 1, 1); }
    h += `<div style="overflow-x:auto;padding-bottom:20px"><div class="fil-zone" style="height:${total}px;min-width:${larg}px;--larg:${larg - 64}px">${mois}<div class="fil-axe"></div>
      <div class="fil-jour" style="top:${HAUT - 9}px" title="Aujourd’hui"></div><div style="position:absolute;left:${GAUCHE}px;top:${HAUT - 24}px;font-size:11px;color:var(--or);font-weight:600;letter-spacing:.1em">AUJOURD’HUI</div>
      ${segs.map(s => `<button class="fil-seg${s.enCours ? ' en-cours' : ''}" data-livre="${s.l.id}" style="left:${GAUCHE + s.v * (LARG + 10)}px;top:${s.haut}px;width:${LARG}px;height:${s.hauteur}px">${couverture(s.l, 30)}<div style="min-width:0"><b style="${s.hauteur < 96 ? '-webkit-line-clamp:1' : ''}">${esc(titreCourt(s.l))}</b><small>${esc(s.dates)}</small><small style="color:${s.enCours ? 'var(--or)' : ''}">${esc(s.etat)}</small></div></button>`).join('')}
    </div></div>`;
    el.innerHTML = h;
    el.querySelectorAll('[data-livre]').forEach(b => b.onclick = () => Fiche.ouvrir(+b.dataset.livre));
  }
};

/* =========================================================
   Lot 2 — Édition, ajout par ISBN, export .zip
   ========================================================= */
const Edition = (() => {
  const jour = ms => { if (!ms) return ''; const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const depuisJour = v => { if (!v) return null; const [a, m, j] = v.split('-').map(Number); return new Date(a, m - 1, j, 12).getTime(); };
  const entier = v => { const n = parseInt(String(v).replace(/\s/g, ''), 10); return Number.isFinite(n) && n > 0 ? n : null; };
  const nouvelId = liste => liste.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1;
  function propre(o){ const r = {}; for (const k in o) if (!k.startsWith('_')) r[k] = o[k]; return r; }

  async function enregistrer(){
    indexer();
    M.racine.lectures = M.lectures.map(propre);
    M.racine.citations = M.citations.map(propre);
    M.racine.liens = M.liens.map(propre);
    M.racine.modifieLe = Date.now();
    try { await Base.ecrireDonnees(M.racine); } catch (e) { console.error(e); toast('Enregistrement impossible dans ce navigateur'); }

    if (vueCourante === 'chercher') Chercher.resultats();
    if (vueCourante === 'carnet') Carnet.rendre();
    if (vueCourante === 'fil') Fil.rendre();
    if (vueCourante === 'reglages') Reglages.rendre();
  }
  const nonExporte = () => !!(M.racine && M.racine.modifieLe && (!M.racine.exporteLe || M.racine.modifieLe > M.racine.exporteLe));

  /* ---------- Thèmes depuis une catégorie (Google Books / Open Library) ---------- */
  const CORRESP = [[['manga'],'Manga'],[['comic','graphic novel','bande dessinée','bandes dessinées'],'Bande dessinée'],[['juvenile','young adult','children'],'Littérature jeunesse'],[['science fiction'],'Science-fiction'],[['fantasy'],'Fantasy'],[['horror','ghost','fantastique'],'Fantastique & horreur'],[['mystery','thriller','crime','detective','suspense','policier'],'Policier & thriller'],[['historical fiction','fiction / historical'],'Roman historique'],[['short stories','nouvelles'],'Nouvelles'],[['poetry','poésie'],'Poésie'],[['drama','théâtre'],'Théâtre'],[['body, mind & spirit','occult','spiritual','esoter','ésotér','mysticism'],'Spiritualité & ésotérisme'],[['religion','mytholog','bible'],'Religion & mythologie'],[['philosoph'],'Philosophie'],[['psycholog'],'Psychologie'],[['science','mathematic','technology','computers','medical','astronom','physics'],'Sciences'],[['history','histoire'],'Histoire'],[['social science','political','business','economics','law','sociolog'],'Société & politique'],[['biography','autobiography','memoir'],'Biographie & mémoires'],[['literary criticism','literary collections','essays','essai'],'Essai'],[['art','music','photography','architecture','performing arts','design'],'Arts & musique'],[['nature','ecology','environment','gardening'],'Nature & écologie'],[['travel','adventure'],'Voyage & aventure'],[['self-help','health','fitness','personal growth'],'Développement personnel'],[['humor','humour'],'Humour'],[['cooking','cuisine'],'Cuisine'],[['fiction','roman','novel','literature','littérature'],'Roman']];
  function themeDepuis(cat){ if (!cat) return null; const c = cat.toLowerCase(); const t = THEMES.find(x => x.toLowerCase() === c); if (t) return t; const m = CORRESP.find(([mots]) => mots.some(w => c.includes(w))); return m ? m[1] : null; }

  /* ---------- Recherche ISBN ---------- */
  const nettoyerIsbn = s => String(s || '').toUpperCase().replace(/[^0-9X]/g, '');
  function variantes(isbn){
    const v = new Set([isbn]);
    if (isbn.length === 10) { const b = '978' + isbn.slice(0, 9); let t = 0; for (let i = 0; i < 12; i++) t += +b[i] * (i % 2 ? 3 : 1); v.add(b + ((10 - t % 10) % 10)); }
    if (isbn.length === 13 && isbn.startsWith('978')) { const b = isbn.slice(3, 12); let t = 0; for (let i = 0; i < 9; i++) t += +b[i] * (10 - i); const c = (11 - t % 11) % 11; v.add(b + (c === 10 ? 'X' : c)); }
    return v;
  }
  const delai = () => (AbortSignal && AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined);
  async function json(url){ const r = await fetch(url, { signal: delai() }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
  async function googleBooks(isbn){
    const vs = variantes(isbn);
    for (const q of ['isbn:' + isbn, isbn]) {
      const d = await json('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(q));
      for (const it of d.items || []) {
        const v = it.volumeInfo || {};
        if (!(v.industryIdentifiers || []).some(x => vs.has(nettoyerIsbn(x.identifier)))) continue;   // vérification exacte
        const img = v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail);
        return { titre: v.title, sousTitre: v.subtitle, auteur: (v.authors || []).join(', '), pagesTotal: v.pageCount || null,
          couvertureUrl: img ? img.replace(/^http:/, 'https:').replace('&edge=curl', '') : null,
          resume: v.description || '', theme: (v.categories || []).map(themeDepuis).find(Boolean) || null, source: 'Google Books' };
      }
    }
    return null;
  }
  async function openLibrary(isbn){
    const d = await json(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    const b = d['ISBN:' + isbn]; if (!b) return null;
    return { titre: b.title, sousTitre: b.subtitle, auteur: (b.authors || []).map(a => a.name).join(', '), pagesTotal: b.number_of_pages || null,
      couvertureUrl: b.cover ? (b.cover.medium || b.cover.large) : null, resume: '',
      theme: (b.subjects || []).map(x => themeDepuis(x.name)).find(Boolean) || null, source: 'Open Library' };
  }
  /* BnF : catalogue général, API SRU, Dublin Core (même lecture que l'appli) */
  function auteurBnf(c){
    const role = (c.includes('. ') ? c.slice(c.lastIndexOf('. ') + 2) : '').toLowerCase();
    if (['traduct','préfac','postfac','éditeur','directeur','commentateur','annotateur','colori','lettr','photograph','collaborat'].some(x => role.includes(x))) return null;
    const nom = c.split(' (')[0].split('. ')[0].trim().replace(/\.$/, '');
    const m = nom.split(', '); return (m.length >= 2 ? m[1] + ' ' + m[0] : nom).trim() || null;
  }
  const GENERIQUES = ['romans, nouvelles','roman','ouvrages pour la jeunesse','jeunesse','bandes dessinées','bande dessinée','mangas','récits personnels','biographies','littérature','siècle','ouvrages de vulgarisation','essais','anthologies','théâtre','poésie','fiction','documents','manuels','textes','critique et interprétation','ouvrages illustrés','albums','contes','nouvelles','correspondance','dictionnaires'];
  function motsDepuisSujets(sujets){
    const vus = new Set(), res = [];
    for (let s of sujets) {
      s = s.split(' -- ')[0].trim().replace(/[.\s]+$/, '');
      if (s.length < 3 || s.length > 40 || /\d/.test(s) || GENERIQUES.some(g => s.toLowerCase().includes(g))) continue;
      if ((s.match(/\p{Lu}/gu) || []).length < 2) s = s.charAt(0).toLowerCase() + s.slice(1);
      if (!vus.has(s.toLowerCase())) { vus.add(s.toLowerCase()); res.push(s); }
    }
    return res.slice(0, 6);
  }
  async function bnf(isbn){
    const cql = `bib.fuzzyISBN all "${isbn}"`;
    const r = await fetch('https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&query=' + encodeURIComponent(cql) + '&recordSchema=dublincore&maximumRecords=1', { signal: delai() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const doc = new DOMParser().parseFromString(await r.text(), 'application/xml');
    const rec = doc.getElementsByTagName('srw:record')[0]; if (!rec) return null;
    const tous = n => [...rec.getElementsByTagName(n)].map(e => e.textContent.trim()).filter(Boolean);
    const titreBrut = tous('dc:title')[0]; if (!titreBrut) return null;
    const createurs = tous('dc:creator'), sujets = tous('dc:subject'), types = tous('dc:type'), formats = tous('dc:format');
    const auteurs = [...new Set(createurs.map(auteurBnf).filter(Boolean))].slice(0, 2);
    const estBd = [...sujets, ...types].some(x => /bandes? dessinée/i.test(x)) || createurs.join(' ').toLowerCase().includes('scénariste');
    const pages = formats.map(f => (/(\d{2,4})\s*p\./.exec(f) || [])[1]).find(Boolean);
    return { titre: titreBrut.split(' / ')[0].trim().replace(/[.\s]+$/, ''), sousTitre: null, auteur: auteurs.join(', '), pagesTotal: pages ? +pages : null,
      couvertureUrl: null, resume: '', theme: estBd ? 'Bande dessinée' : null, estBd, motsCles: motsDepuisSujets(sujets), source: 'BnF' };
  }
  /* Recherche par titre et auteur : toutes les éditions trouvées, au choix */
  async function chercherEditions(titre, auteur){
    const res = [], vus = new Set();
    const ajouter = e => { const k = e.isbn ? (e.isbn.length === 10 ? [...variantes(e.isbn)].find(x => x.length === 13) || e.isbn : e.isbn) : norm(e.titre + e.editeur + e.annee); if (vus.has(k)) return; vus.add(k); res.push(e); };
    const taches = [
      (async () => {   // BnF
        let cql = `bib.title all "${titre.replace(/"/g, '')}"`; if (auteur) cql += ` and bib.author all "${auteur.replace(/"/g, '')}"`;
        const r = await fetch('https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&query=' + encodeURIComponent(cql) + '&recordSchema=dublincore&maximumRecords=15', { signal: delai() });
        const doc = new DOMParser().parseFromString(await r.text(), 'application/xml'); const out = [];
        for (const rec of doc.getElementsByTagName('srw:record')) {
          const tous = n => [...rec.getElementsByTagName(n)].map(e => e.textContent.trim()).filter(Boolean);
          const t = (tous('dc:title')[0] || '').split(' / ')[0].trim(); if (!t) continue;
          const isbn = (tous('dc:identifier').map(x => /ISBN\s*([\dX-]{10,17})/i.exec(x)).find(Boolean) || [])[1];
          const sujets = tous('dc:subject'), pages = tous('dc:format').map(f => (/(\d{2,4})\s*p\./.exec(f) || [])[1]).find(Boolean);
          out.push({ titre: t.replace(/[.\s]+$/, ''), auteur: [...new Set(tous('dc:creator').map(auteurBnf).filter(Boolean))].slice(0, 2).join(', '), editeur: (tous('dc:publisher')[0] || '').split(' (')[0].replace(/^[^:]*:\s*/, ''), annee: (tous('dc:date')[0] || '').slice(0, 4),
            isbn: isbn ? nettoyerIsbn(isbn) : null, pagesTotal: pages ? +pages : null, couvertureUrl: null, resume: '', estBd: sujets.some(x => /bandes? dessinée/i.test(x)), motsCles: motsDepuisSujets(sujets), source: 'BnF' });
        }
        return out;
      })(),
      (async () => {   // Google Books
        const q = `intitle:${titre}` + (auteur ? ` inauthor:${auteur}` : '');
        const d = await json('https://www.googleapis.com/books/v1/volumes?maxResults=20&printType=books&q=' + encodeURIComponent(q));
        return (d.items || []).map(it => { const v = it.volumeInfo || {}, ids = v.industryIdentifiers || [], img = v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail);
          const isbn = (ids.find(x => x.type === 'ISBN_13') || ids.find(x => x.type === 'ISBN_10') || {}).identifier;
          return { titre: v.title || '', sousTitre: v.subtitle, auteur: (v.authors || []).join(', '), editeur: v.publisher || '', annee: (v.publishedDate || '').slice(0, 4), isbn: isbn ? nettoyerIsbn(isbn) : null,
            pagesTotal: v.pageCount || null, couvertureUrl: img ? img.replace(/^http:/, 'https:').replace('&edge=curl', '') : null, resume: v.description || '', theme: (v.categories || []).map(themeDepuis).find(Boolean) || null, source: 'Google Books' }; });
      })(),
      (async () => {   // Open Library
        const d = await json(`https://openlibrary.org/search.json?limit=10&fields=title,author_name,first_publish_year,isbn,cover_i,number_of_pages_median,publisher&title=${encodeURIComponent(titre)}${auteur ? '&author=' + encodeURIComponent(auteur) : ''}`);
        return (d.docs || []).map(x => ({ titre: x.title || '', auteur: (x.author_name || []).slice(0, 2).join(', '), editeur: (x.publisher || [])[0] || '', annee: x.first_publish_year ? String(x.first_publish_year) : '',
          isbn: (x.isbn || []).map(nettoyerIsbn).find(i => i.length === 13) || null, pagesTotal: x.number_of_pages_median || null, couvertureUrl: x.cover_i ? `https://covers.openlibrary.org/b/id/${x.cover_i}-M.jpg` : null, resume: '', source: 'Open Library' }));
      })()
    ];
    const lots = await Promise.allSettled(taches);
    if (lots.every(l => l.status === 'rejected')) throw new Error(lots.some(l => l.reason instanceof TypeError) ? 'reseau' : 'erreur');
    for (const l of lots) if (l.status === 'fulfilled') l.value.filter(e => e.titre).forEach(ajouter);
    return res.slice(0, 25);
  }
  async function chercherIsbn(isbn){
    let res = null, bloque = 0, essais = 0; const sources = [];
    for (const f of [bnf, googleBooks, openLibrary]) {
      essais++;
      try { const r = await f(isbn); if (r) { sources.push(r.source); res = res ? { ...r, ...Object.fromEntries(Object.entries(res).filter(([, v]) => v && !(Array.isArray(v) && !v.length))) } : r; } }
      catch (e) { if (e instanceof TypeError) bloque++; console.warn(f.name, e); }
    }
    if (!res && bloque === essais) throw new Error('reseau');
    if (res) res.source = sources.join(' + ');
    return res;
  }

  /* ---------- Couverture choisie : réduite à 800 px, gardée dans le navigateur ---------- */
  async function reduireImage(fichier){
    const bmp = await createImageBitmap(fichier);
    const f = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * f); c.height = Math.round(bmp.height * f);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(ok => c.toBlob(ok, 'image/jpeg', .85));
  }
  async function poserCouverture(l, blob){
    const ancien = (l.couvertureUrl || '').startsWith('local:') ? l.couvertureUrl.slice(6) : null;
    const nom = `lecture_${l.id}_${Date.now()}.jpg`;
    await Base.ecrireCouverture(nom, blob);
    M.urlsCouv.set(nom, URL.createObjectURL(blob));
    if (ancien && ancien !== nom) { await Base.supprimerCouverture(ancien).catch(() => {}); const u = M.urlsCouv.get(ancien); if (u) URL.revokeObjectURL(u); M.urlsCouv.delete(ancien); }
    l.couvertureUrl = 'local:' + nom;
  }

      isbn: nettoyerIsbn(v('isbn')) || null, pretA: v('pretA') || null

  async function choisirEdition(el, f, e){

    }

  function afficherConserve(el){ const sc = el.querySelector('.fiche-corps').scrollTop; afficher(); $('#fiche .fiche-corps').scrollTop = sc; }
  async function rechercheIsbn(el, f){
    const isbn = nettoyerIsbn(f.elements.isbnRecherche.value), out = el.querySelector('#e-isbn-res');
    if (isbn.length !== 10 && isbn.length !== 13) { out.innerHTML = '<span style="color:var(--corail)">Un ISBN compte 10 ou 13 chiffres.</span>'; return; }
    const doublon = M.lectures.find(l => l.isbn && variantes(isbn).has(nettoyerIsbn(l.isbn)));
    out.textContent = 'Recherche…';
    try {
      const r = await chercherIsbn(isbn);
      lireForm(f); brouillon.isbn = isbn;
      if (!r) { out.innerHTML = 'Aucune fiche trouvée pour cet ISBN. Remplis-la à la main.'; return; }
      const titre = r.titre ? (r.sousTitre && r.titre.length < 25 ? `${r.titre} : ${r.sousTitre}` : r.titre) : '';
      if (!brouillon.titre) brouillon.titre = titre;
      if (!brouillon.auteur) brouillon.auteur = r.auteur || '';
      if (!brouillon.pagesTotal) brouillon.pagesTotal = r.pagesTotal;
      if (!brouillon.theme && r.theme) brouillon.theme = r.theme;
      if (!brouillon.resume && r.resume) { brouillon.resume = r.resume; brouillon.sourceResume = r.source; }
      if (!brouillon.couvertureUrl && r.couvertureUrl && !imageChoisie) brouillon.couvertureUrl = r.couvertureUrl;

    } catch (e) {
      out.innerHTML = e.message === 'reseau'
        ? '<span style="color:var(--or)">La recherche en ligne est bloquée sur cette page claude.ai (elle marchera une fois le site hébergé). Remplis la fiche à la main.</span>'
        : 'Recherche impossible pour l’instant. Remplis la fiche à la main.';

  }
  async function valider(){
    const b = brouillon;
    if (!b.titre) { toast('Il faut au moins un titre'); return; }
    if (b.statut === 'EN_COURS' && !b.dateDebut) b.dateDebut = Date.now();

    if (b.pagesTotal && b.pageActuelle > b.pagesTotal) b.pageActuelle = b.pagesTotal;
    const nouveau = b.id == null;
    let l; const ancienneCouv = nouveau ? null : (M.parId.get(b.id)?.couvertureUrl || '');
    if (nouveau) { b.id = nouvelId(M.lectures); b.dateAjout = Date.now(); l = propre(b); M.lectures.push(l); }
    else { l = M.parId.get(b.id); if (!l) return; Object.assign(l, propre(b)); }

  function supprimer(id){

  /* ---------- Ajout direct d'un ISBN (scan en rafale) ---------- */
  async function ajouterDepuisIsbn(isbn, majEnCours){
    const doublon = M.lectures.find(l => l.isbn && variantes(isbn).has(nettoyerIsbn(l.isbn)));
    if (doublon) return { titre: doublon.titre, etat: 'déjà là', ok: false };

    const l = modele();

    M.lectures.push(l); await enregistrer();

    // 2. puis on la complète
    let r = null; try { r = await chercherIsbn(isbn); } catch (e) { r = null; }
    if (!M.parId.has(l.id)) return { titre: l.titre, etat: 'supprimé', ok: false };

      l.titre = r.titre ? (r.sousTitre && r.titre.length < 25 ? `${r.titre} : ${r.sousTitre}` : r.titre) : '';
      l.auteur = r.auteur || ''; l.pagesTotal = r.pagesTotal || null; l.theme = r.theme || null; l.couvertureUrl = r.couvertureUrl || null;
