    }
    if (!l.titre) l.titre = 'ISBN ' + isbn;
    await enregistrer();
    const m = M.parId.get(l.id)._manques;
    return { id: l.id, titre: l.titre, etat: m.length ? 'à compléter' : 'ajouté', ok: true };
  }

  /* ---------- Compléments dans la fiche : citations, liens ---------- */
  function complement(l, onglet){
    if (onglet === 'citations') return `<div class="carte" style="margin-top:8px"><div class="sur" style="margin-bottom:8px">Nouvelle citation</div><textarea class="inp" id="c-texte" placeholder="Le passage, sans guillemets"></textarea><div style="display:flex;gap:8px;margin-top:8px"><input class="inp" id="c-page" inputmode="numeric" placeholder="Page" style="width:96px"><button type="button" class="btn petit" id="c-dicter">🎙 Dicter</button><button class="btn or" id="c-ajouter" style="margin-left:auto">Garder</button></div></div>`;
    if (onglet === 'proches') return `<div class="carte" style="margin-top:8px"><div class="sur" style="margin-bottom:8px">Relier à un autre livre</div><input class="inp" id="r-livre" list="liste-livres" placeholder="Titre du livre"><datalist id="liste-livres">${M.lectures.filter(o => o.id !== l.id).map(o => `<option value="${esc(titreCourt(o) + ' — ' + (o.auteur || '?'))}">`).join('')}</datalist><input class="inp" id="r-raison" placeholder="Pourquoi, en quelques mots" style="margin-top:8px"><div style="display:flex;margin-top:8px"><button class="btn or" id="r-ajouter" style="margin-left:auto">Relier</button></div></div>`;
    if (onglet === 'lecture' && l.statut !== 'LU') return `<div class="carte" style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="sur">J’en suis à la page</span><input class="inp" id="p-page" inputmode="numeric" value="${l.pageActuelle ?? ''}" style="width:90px">${l.pagesTotal ? `<span class="doux">/ ${l.pagesTotal}</span>` : ''}<button class="btn petit" id="p-ok">OK</button>${l.statut === 'A_LIRE' ? '<button class="btn or petit" id="p-commencer" style="margin-left:auto">Commencer</button>' : '<button class="btn or petit" id="p-fini" style="margin-left:auto">Terminé ✓</button>'}</div>`;
    return '';
  }
  function relier(a, b, raison){
    if (a === b || M.liens.some(x => (x.lectureA === a && x.lectureB === b) || (x.lectureA === b && x.lectureB === a))) { toast('Ces deux livres sont déjà reliés'); return false; }
    M.liens.push({ id: nouvelId(M.liens), lectureA: a, lectureB: b, raison: raison || '', dateAjout: Date.now() }); return true;
  }
  function brancher(el, l, onglet){
    const apres = async msg => { await enregistrer(); Fiche.rafraichir(); if (msg) toast(msg); };
    el.querySelectorAll('[data-supcit]').forEach(b => b.onclick = () => confirmer('Supprimer cette citation ?', 'Elle disparaîtra aussi du carnet.', 'Supprimer', async () => { M.citations = M.citations.filter(c => c.id !== +b.dataset.supcit); await apres('Citation supprimée'); }));
    el.querySelectorAll('[data-delier]').forEach(b => b.onclick = async () => { const o = +b.dataset.delier; M.liens = M.liens.filter(x => !((x.lectureA === l.id && x.lectureB === o) || (x.lectureA === o && x.lectureB === l.id))); await apres('Lien retiré'); });
    el.querySelectorAll('[data-relier]').forEach(b => b.onclick = async () => { if (relier(l.id, +b.dataset.relier, b.dataset.raison)) await apres('Livres reliés'); });
    Dictee.brancher(el.querySelector('#c-dicter'), el.querySelector('#c-texte'));
    const ca = el.querySelector('#c-ajouter'); if (ca) ca.onclick = async () => { Dictee.arreter(); const t = el.querySelector('#c-texte').value.trim().replace(/^[«"“]\s*|\s*[»"”]$/g, ''); if (!t) return; M.citations.push({ id: nouvelId(M.citations), lectureId: l.id, texte: t, page: entier(el.querySelector('#c-page').value), dateAjout: Date.now() }); await apres('Citation gardée'); };
    const ra = el.querySelector('#r-ajouter'); if (ra) ra.onclick = async () => {
      const v = el.querySelector('#r-livre').value.trim(); if (!v) return;
      const cible = M.lectures.find(o => o.id !== l.id && (titreCourt(o) + ' — ' + (o.auteur || '?')) === v) || M.lectures.find(o => o.id !== l.id && norm(o.titre) === norm(v));
      if (!cible) { toast('Choisis un livre de la liste'); return; }
      if (relier(l.id, cible.id, el.querySelector('#r-raison').value.trim())) await apres('Livres reliés');
    };
    const pp = el.querySelector('#p-ok'); if (pp) pp.onclick = async () => { const p = entier(el.querySelector('#p-page').value); l.pageActuelle = l.pagesTotal && p > l.pagesTotal ? l.pagesTotal : p; await apres('Progression notée'); };
    const pc = el.querySelector('#p-commencer'); if (pc) pc.onclick = async () => { l.statut = 'EN_COURS'; l.dateDebut = l.dateDebut || Date.now(); await apres('Bonne lecture'); };
    const pf = el.querySelector('#p-fini'); if (pf) pf.onclick = async () => { l.statut = 'LU'; l.dateFin = l.dateFin || Date.now(); if (l.pagesTotal) l.pageActuelle = l.pagesTotal; await apres('Lecture terminée ✓'); };
  }

  /* ---------- Export .zip (même format que l'appli) ---------- */
  const TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function creerZip(fichiers){
    const enc = new TextEncoder(), parts = [], central = []; let pos = 0;
    const d = new Date(), heure = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dt = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (const f of fichiers) {
      const nom = enc.encode(f.nom), crc = crc32(f.data), n = f.data.length;
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint16(10, heure, true); h.setUint16(12, dt, true);
      h.setUint32(14, crc, true); h.setUint32(18, n, true); h.setUint32(22, n, true); h.setUint16(26, nom.length, true); h.setUint16(28, 0, true);
      parts.push(h.buffer, nom, f.data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, heure, true); c.setUint16(14, dt, true);
      c.setUint32(16, crc, true); c.setUint32(20, n, true); c.setUint32(24, n, true); c.setUint16(28, nom.length, true); c.setUint32(42, pos, true);
      central.push(c.buffer, nom);
      pos += 30 + nom.length + n;
    }
    const taille = central.reduce((t, x) => t + x.byteLength, 0);
    const fin = new DataView(new ArrayBuffer(22));
    fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, fichiers.length, true); fin.setUint16(10, fichiers.length, true); fin.setUint32(12, taille, true); fin.setUint32(16, pos, true);
    return new Blob([...parts, ...central, fin.buffer], { type: 'application/zip' });
  }
  async function construireExport(){
    const fichiers = [], utilises = new Set();
    for (const l of M.lectures) if ((l.couvertureUrl || '').startsWith('local:')) {
      const nom = l.couvertureUrl.slice(6); if (utilises.has(nom)) continue;
      const blob = await Base.lireCouverture(nom).catch(() => null);
      if (blob) { fichiers.push({ nom: 'couvertures/' + nom, data: new Uint8Array(await blob.arrayBuffer()) }); utilises.add(nom); }
    }
    const lectures = M.lectures.map(propre).map(l => ((l.couvertureUrl || '').startsWith('local:') && !utilises.has(l.couvertureUrl.slice(6))) ? { ...l, couvertureUrl: null } : l);
    const racine = { application: 'Phylactère', version: M.racine.version || 3, date: Date.now(), lectures, citations: M.citations.map(propre), liens: M.liens.map(propre) };
    fichiers.unshift({ nom: 'donnees.json', data: new TextEncoder().encode(JSON.stringify(racine, null, 2)) });
    return { blob: creerZip(fichiers), nb: lectures.length, couv: utilises.size };
  }
  async function exporter(){
    try {
      const { blob, nb, couv } = await construireExport();
      const nom = `phylactere-web-${jour(Date.now())}.zip`;
      let ok = false;
      const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl) {
        try { await dl.save({ filename: nom, data: blob }); ok = true; }
        catch (e) { if (e && e.code === 'declined') { toast('Export annulé'); return; } if (e && e.code === 'rate_limited') { toast('Une fenêtre d’enregistrement est déjà ouverte'); return; } console.warn(e); }
      }
      if (!ok && !dl) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); ok = true; }
      if (!ok) { toast('Export impossible ici'); return; }
      M.racine.exporteLe = Date.now(); await Base.ecrireDonnees(M.racine);
      toast(`${nb} lectures et ${couv} couvertures exportées`);
      if (vueCourante === 'reglages') Reglages.rendre();
    } catch (e) { console.error(e); toast('Export impossible : ' + (e.message || e)); }
  }

  $('#nav-ajouter').addEventListener('click', () => nouveau());
  async function ajouterPlusieurs(liste){ for (const o of liste) M.lectures.push({ ...modele(), ...o, id: nouvelId(M.lectures), dateAjout: Date.now() }); await enregistrer(); }
  async function ajouterSimple(o){ const l = { ...modele(), ...o, id: nouvelId(M.lectures), dateAjout: Date.now() }; M.lectures.push(l); await enregistrer(); return l; }
  return { ouvrir, nouveau, complement, brancher, exporter, nonExporte, construireExport, chercherIsbn, ajouterDepuisIsbn, ajouterSimple, ajouterPlusieurs };
})();

/* =========================================================
   Scanner de code-barres (caméra du téléphone ou de la tablette)
   BarcodeDetector intégré (Chrome Android) ; sinon ZXing (Safari iPhone/iPad)
   ========================================================= */
const Scanner = (() => {
  const ZXING_URL = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
  let flux = null, boucle = null, actif = false, detecteur = null, zx = null;
  let rafale = false, surIsbn = null, vus = new Set(), dernier = { code: '', t: 0 }, occupe = false, ajoutes = [];

  function isbnValide(c){
    if (!/^97[89]\d{10}$/.test(c)) return false;
    let t = 0; for (let i = 0; i < 12; i++) t += +c[i] * (i % 2 ? 3 : 1);
    return (10 - t % 10) % 10 === +c[12];
  }
  async function preparer(){
    if (detecteur || zx) return;
    if ('BarcodeDetector' in window) {
      try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('ean_13')) { detecteur = new BarcodeDetector({ formats: ['ean_13'] }); return; } } catch (e) {}
    }
    if (!window.ZXing) await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = ZXING_URL; s.onload = ok; s.onerror = () => ko(new Error('Lecteur de codes-barres indisponible (connexion ?)')); document.head.appendChild(s); });
    const Z = window.ZXing, hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const r = new Z.MultiFormatReader(); r.setHints(hints);
    zx = { Z, r };
  }
  async function lireSource(src, l, h){
    // src : vidéo ou image ; on lit la bande centrale (là où l'on vise), puis l'image entière si besoin
    if (detecteur) { const res = await detecteur.detect(src); return res.map(x => x.rawValue); }
    const c = lireSource.c || (lireSource.c = document.createElement('canvas'));
    const essais = [[.08, .3, .84, .4], [0, 0, 1, 1]];
    for (const [x, y, w, hh] of essais) {
      const sw = Math.round(l * w), sh = Math.round(h * hh), f = Math.min(1, 1000 / sw);
      c.width = Math.round(sw * f); c.height = Math.round(sh * f);
      const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(src, l * x, h * y, sw, sh, 0, 0, c.width, c.height);
      try { const src2 = new zx.Z.HTMLCanvasElementLuminanceSource(c); const res = zx.r.decode(new zx.Z.BinaryBitmap(new zx.Z.HybridBinarizer(src2))); zx.r.reset(); return [res.getText()]; }
      catch (e) { zx.r.reset(); }
    }
    return [];
  }

  function rendre(msg){
    let o = $('#scanner');
    if (!o) {
      o = document.createElement('div'); o.id = 'scanner'; document.body.appendChild(o);
    }
    o.innerHTML = `<div class="sc-haut"><div><div class="sur" style="color:var(--or)">${rafale ? 'Scan en rafale' : 'Scanner'}</div><div id="sc-msg" class="doux" style="font-size:13.5px;margin-top:4px">${esc(msg || 'Vise le code-barres au dos du livre')}</div></div><button class="fermer" id="sc-fermer" aria-label="Fermer" style="position:static">✕</button></div>
      <div class="sc-video"><video id="sc-video" playsinline muted autoplay></video><div class="sc-cadre"><i></i></div></div>
      ${rafale ? `<div class="sc-liste" id="sc-liste">${ajoutes.length ? '' : '<span class="doux">Les livres scannés s’ajoutent « À lire ».</span>'}</div>` : ''}
      <div class="sc-bas"><label class="btn petit">📷 Photo du code<input type="file" accept="image/*" capture="environment" id="sc-photo" hidden></label>${rafale ? `<button class="btn or" id="sc-fin">Terminer${ajoutes.length ? ` (${ajoutes.length})` : ''}</button>` : ''}</div>`;
    o.classList.add('ouvert');
    $('#sc-fermer').onclick = fermer; const fin = $('#sc-fin'); if (fin) fin.onclick = fermer;
    $('#sc-photo').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) photo(f); };
    majListe();
  }
  const dire = (m, couleur) => { const e = $('#sc-msg'); if (e) { e.textContent = m; e.style.color = couleur || ''; } };
  function majListe(){
    const L = $('#sc-liste'); if (!L || !ajoutes.length) return;
    L.innerHTML = ajoutes.slice().reverse().map(a => `<div class="sc-item"><span style="color:${a.ok ? 'var(--or)' : 'var(--brume)'}">${a.ok ? '✦' : '…'}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.titre)}</span><span class="doux" style="font-size:12px">${esc(a.etat)}</span></div>`).join('');
    const fin = $('#sc-fin'); if (fin) fin.textContent = `Terminer (${ajoutes.filter(a => a.ok).length})`;
  }

  async function trouve(code){
    if (!isbnValide(code)) { dire('Ce code-barres n’est pas un ISBN (978… ou 979…)', 'var(--corail)'); return; }
    const now = performance.now();
    if (code === dernier.code && now - dernier.t < 2500) return;
    dernier = { code, t: now };
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
    if (!rafale) { const cb = surIsbn; fermer(); cb && cb(code); return; }
    if (vus.has(code)) { dire('Déjà scanné : ' + code); return; }
    vus.add(code);
    const a = { titre: 'ISBN ' + code, etat: 'recherche…', ok: false }; ajoutes.push(a); majListe();
    dire('Lu : ' + code + ' — vise le suivant', 'var(--or)');
    // on n'attend pas la recherche pour viser le livre suivant
    Edition.ajouterDepuisIsbn(code, x => { Object.assign(a, x); majListe(); }).then(r => { Object.assign(a, r); majListe(); }).catch(e => { a.etat = 'erreur'; console.warn(e); majListe(); });
  }
  async function balayer(){
    if (!actif) return;
    const v = $('#sc-video');
    if (v && v.readyState >= 2 && !occupe) {
      occupe = true;
      try { const codes = await lireSource(v, v.videoWidth, v.videoHeight); if (codes[0]) await trouve(codes[0].replace(/\D/g, '')); }
      catch (e) { console.warn(e); }
      occupe = false;
    }
    if (actif) boucle = setTimeout(balayer, detecteur ? 120 : 180);
  }
  async function photo(f){
    dire('Lecture de la photo…');
    try {
      await preparer();
      const img = await createImageBitmap(f);
      const codes = await lireSource(img, img.width, img.height);
      if (codes[0]) await trouve(codes[0].replace(/\D/g, ''));
      else dire('Pas de code-barres trouvé : rapproche-toi, évite les reflets', 'var(--corail)');
    } catch (e) { dire(e.message || 'Photo illisible', 'var(--corail)'); }
  }
  async function ouvrir(opts){
    rafale = !!opts.rafale; surIsbn = opts.surIsbn || null; vus = new Set(); ajoutes = []; dernier = { code: '', t: 0 };
    rendre('Ouverture de la caméra…'); actif = true;
    try { await preparer(); }
    catch (e) { dire(e.message + ' — utilise « Photo du code »', 'var(--corail)'); }
    if (!navigator.mediaDevices?.getUserMedia) { dire('Caméra en direct indisponible ici : utilise « Photo du code »', 'var(--or)'); return; }
    try {
      flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      if (!actif) { arreterFlux(); return; }
      const v = $('#sc-video'); v.srcObject = flux; await v.play().catch(() => {});
      try { const piste = flux.getVideoTracks()[0]; const cap = piste.getCapabilities?.(); if (cap?.focusMode?.includes('continuous')) await piste.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
      dire(rafale ? 'Vise les codes-barres l’un après l’autre' : 'Vise le code-barres au dos du livre');
      balayer();
    } catch (e) {
      dire(e.name === 'NotAllowedError' ? 'Caméra refusée : autorise-la dans le navigateur, ou utilise « Photo du code »' : 'Caméra indisponible : utilise « Photo du code »', 'var(--corail)');
    }
  }
  function arreterFlux(){ if (flux) { flux.getTracks().forEach(t => t.stop()); flux = null; } }
  function fermer(){
    actif = false; clearTimeout(boucle); arreterFlux();
    const o = $('#scanner'); if (o) o.classList.remove('ouvert');
    if (rafale) {
      rafale = false; const ids = ajoutes.filter(a => a.ok && a.id).map(a => a.id), n = ids.length;
      if (n) {   // montre tout de suite les livres scannés
        toast(`${n} livre${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''} « À lire »${ajoutes.some(a => a.etat === 'recherche…') ? ' · recherche en cours' : ''}`);
        Chercher.limite = { ids, titre: 'Scannés à l’instant' }; Chercher.mode = 'liste'; Chercher.filtre = 'TOUS'; Chercher.requete = '';
        if (location.hash === '#chercher') Chercher.rendre(); else location.hash = 'chercher';
      }
    }
  }
  addEventListener('keydown', e => { if (e.key === 'Escape' && actif) fermer(); });
  return { ouvrir, fermer, isbnValide };
})();

/* =========================================================
   Dictée (notes et citations) — reconnaissance vocale du navigateur
   ========================================================= */
const Dictee = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, bouton = null;
  function arreter(){ try { rec && rec.stop(); } catch (e) {} rec = null; if (bouton) { bouton.classList.remove('or'); bouton.textContent = '🎙 Dicter'; } bouton = null; }
  function brancher(btn, cible){
    if (!btn) return;
    if (!SR) { btn.hidden = true; return; }
    btn.onclick = () => {
      if (rec && bouton === btn) { arreter(); return; }
      arreter();
      rec = new SR(); rec.lang = 'fr-FR'; rec.continuous = true; rec.interimResults = false;
      rec.onresult = ev => { let t = ''; for (let i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) t += ev.results[i][0].transcript; t = t.trim(); if (!t) return;
        const v = cible.value; cible.value = v + (v && !/\s$/.test(v) ? ' ' : '') + t.charAt(0).toUpperCase() + t.slice(1); cible.dispatchEvent(new Event('input')); };
      rec.onerror = ev => { toast(ev.error === 'not-allowed' ? 'Micro refusé par le navigateur' : 'Dictée interrompue'); arreter(); };
      rec.onend = () => { if (bouton === btn) arreter(); };
      try { rec.start(); bouton = btn; btn.classList.add('or'); btn.textContent = '■ Arrêter'; } catch (e) { toast('Dictée indisponible'); arreter(); }
    };
  }
  return { brancher, arreter, possible: !!SR };
})();

/* =========================================================
   Recadrer et tourner une couverture
   ========================================================= */
const Recadreur = (() => {
  function ouvrir(bitmap){
    return new Promise(resoudre => {
      let src = document.createElement('canvas'); src.width = bitmap.width; src.height = bitmap.height; src.getContext('2d').drawImage(bitmap, 0, 0);
      const o = document.createElement('div'); o.id = 'recadreur';
      o.innerHTML = `<div class="sc-haut"><div><div class="sur" style="color:var(--or)">Couverture</div><div class="doux" style="font-size:13.5px;margin-top:4px">Fais glisser le cadre ou ses coins, tourne si besoin.</div></div></div>
        <div class="rc-scene" id="rc-scene"><div class="rc-boite" id="rc-boite"><canvas id="rc-img"></canvas><div class="rc-cadre" id="rc-cadre"><i data-c="nw"></i><i data-c="ne"></i><i data-c="sw"></i><i data-c="se"></i></div></div></div>
        <div class="sc-bas"><div style="display:flex;gap:8px"><button class="rond" id="rc-g" aria-label="Tourner à gauche">↺</button><button class="rond" id="rc-d" aria-label="Tourner à droite">↻</button></div><div style="display:flex;gap:8px"><button class="btn" id="rc-non">Annuler</button><button class="btn or" id="rc-oui">Valider</button></div></div>`;
      document.body.appendChild(o);
      const cv = o.querySelector('#rc-img'), cadre = o.querySelector('#rc-cadre'), scene = o.querySelector('#rc-scene');
      let s = 1, W = 0, Hh = 0, r = null;
      function afficher(){
        const mw = scene.clientWidth - 16, mh = scene.clientHeight - 16;
        s = Math.min(mw / src.width, mh / src.height, 1.5); W = Math.round(src.width * s); Hh = Math.round(src.height * s);
        cv.width = W; cv.height = Hh; cv.getContext('2d').drawImage(src, 0, 0, W, Hh);
        r = { x: W * .04, y: Hh * .04, w: W * .92, h: Hh * .92 }; poser();
      }
      function poser(){ Object.assign(cadre.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' }); }
      function tourner(sens){
        const n = document.createElement('canvas'); n.width = src.height; n.height = src.width; const g = n.getContext('2d');
        g.translate(n.width / 2, n.height / 2); g.rotate(sens * Math.PI / 2); g.drawImage(src, -src.width / 2, -src.height / 2); src = n; afficher();
      }
      let geste = null;
      cadre.addEventListener('pointerdown', e => { e.preventDefault(); cadre.setPointerCapture(e.pointerId); geste = { c: e.target.dataset.c || 'm', x: e.clientX, y: e.clientY, r: { ...r } }; });
      cadre.addEventListener('pointermove', e => {
        if (!geste) return; const dx = e.clientX - geste.x, dy = e.clientY - geste.y, a = geste.r, MIN = 40; let { x, y, w, h } = a;
        if (geste.c === 'm') { x = Math.min(Math.max(0, a.x + dx), W - a.w); y = Math.min(Math.max(0, a.y + dy), Hh - a.h); }
        else {
          if (geste.c.includes('w')) { x = Math.min(Math.max(0, a.x + dx), a.x + a.w - MIN); w = a.x + a.w - x; }
          if (geste.c.includes('e')) { w = Math.min(Math.max(MIN, a.w + dx), W - a.x); }
          if (geste.c.includes('n')) { y = Math.min(Math.max(0, a.y + dy), a.y + a.h - MIN); h = a.y + a.h - y; }
          if (geste.c.includes('s')) { h = Math.min(Math.max(MIN, a.h + dy), Hh - a.y); }
        }
        r = { x, y, w, h }; poser();
      });
      const lacher = () => { geste = null; }; cadre.addEventListener('pointerup', lacher); cadre.addEventListener('pointercancel', lacher);
      const finir = res => { o.remove(); removeEventListener('resize', afficher); resoudre(res); };
      o.querySelector('#rc-g').onclick = () => tourner(-1); o.querySelector('#rc-d').onclick = () => tourner(1);
      o.querySelector('#rc-non').onclick = () => finir(null);
      o.querySelector('#rc-oui').onclick = () => {
        const sx = r.x / s, sy = r.y / s, sw = r.w / s, sh = r.h / s, f = Math.min(1, 800 / Math.max(sw, sh));
        const out = document.createElement('canvas'); out.width = Math.round(sw * f); out.height = Math.round(sh * f);
        out.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, out.width, out.height);
        out.toBlob(b => finir(b), 'image/jpeg', .88);
      };
      addEventListener('resize', afficher);
      requestAnimationFrame(afficher);
    });
  }
  return { ouvrir };
})();

/* =========================================================
   Premier pas : choisir des thèmes et cocher ses lectures
   ========================================================= */
const PremierPas = {
  themes: new Set(), choix: new Map(),
  ouvrir(){ this.themes = new Set(); this.choix = new Map(); this.etape1(); },
  cadre(html){ $('#vue-vide').innerHTML = `<div class="page" style="max-width:720px">${html}</div>`; },
  etape1(){
    this.cadre(`<div class="sur" style="color:var(--or)">Premier pas · 1 sur 2</div><h1 style="margin-top:8px">Quels thèmes t’attirent ?</h1>
      <p class="doux" style="line-height:1.55">Choisis-en deux ou trois. Tu pourras cocher ensuite les livres que tu as déjà lus, pour que ton ciel ne parte pas de rien.</p>
      <div class="choix" style="margin:18px 0 26px">${THEMES.map(t => `<button class="puce" data-t="${esc(t)}" aria-pressed="${this.themes.has(t)}">${esc(t)}</button>`).join('')}</div>
      <div style="display:flex;gap:10px;justify-content:space-between;align-items:center"><button class="btn" id="pp-passer">Passer</button><button class="btn or" id="pp-suite" ${this.themes.size ? '' : 'disabled style="opacity:.5"'}>Continuer${this.themes.size ? ` (${this.themes.size})` : ''}</button></div>`);
    document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = b.dataset.t; this.themes.has(t) ? this.themes.delete(t) : this.themes.add(t); this.etape1(); });
    $('#pp-passer').onclick = () => this.finir();
    $('#pp-suite').onclick = () => { if (this.themes.size) this.etape2(); };
  },
  etape2(){
    const bloc = t => `<div class="etagere"><h2 style="font-size:19px;margin-bottom:6px">${esc(t)}</h2>${(PORTES[t] || []).map(([ti, au, ph]) => { const k = t + '|' + ti, v = this.choix.get(k);
      return `<div class="porte"><div style="flex:1;min-width:0"><div style="font-family:var(--serif);font-size:16px">${esc(ti)}</div><div class="doux" style="font-size:12.5px">${esc(au)} · ${esc(ph)}</div></div><div class="choix" style="flex:none"><button class="puce" data-k="${esc(k)}" data-v="LU" aria-pressed="${v === 'LU'}">Lu</button><button class="puce" data-k="${esc(k)}" data-v="A_LIRE" aria-pressed="${v === 'A_LIRE'}">À lire</button></div></div>`; }).join('')}</div>`;
    const n = this.choix.size;
    this.cadre(`<div class="sur" style="color:var(--or)">Premier pas · 2 sur 2</div><h1 style="margin-top:8px">Qu’as-tu déjà lu ?</h1>
      <p class="doux" style="line-height:1.55">Marque « Lu » ce que tu as lu, « À lire » ce qui te tente. Le reste est ignoré.</p>
      ${[...this.themes].map(bloc).join('')}
      <div class="barre-actions" style="justify-content:space-between"><button class="btn" id="pp-retour">‹ Thèmes</button><button class="btn or" id="pp-fin">${n ? `Créer mon ciel (${n})` : 'Créer mon ciel'}</button></div>`);
    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k, v = b.dataset.v; this.choix.get(k) === v ? this.choix.delete(k) : this.choix.set(k, v); const sc = scrollY, el = $('#vue-vide'), st = el.scrollTop; this.etape2(); el.scrollTop = st; });
    $('#pp-retour').onclick = () => this.etape1();
    $('#pp-fin').onclick = () => this.finir();
  },
  async finir(){
    await Base.remplacer({ application:'Phylactère', version:3, date:Date.now(), lectures:[], citations:[], liens:[], importeLe:Date.now(), fichierSource:'nouvelle bibliothèque' }, []);
    await charger();
    const livres = [];
    for (const [k, statut] of this.choix) { const [theme, ti] = k.split('|'); const p = (PORTES[theme] || []).find(x => x[0] === ti); if (p) livres.push({ titre: p[0], auteur: p[1], theme, statut }); }
    if (livres.length) await Edition.ajouterPlusieurs(livres);
    Ciel.invalider(); location.hash = 'ciel'; montrerVue('ciel');
    toast(livres.length ? `${livres.length} livre${livres.length > 1 ? 's' : ''} dans ton ciel` : 'Ton ciel t’attend : + Ajouter pour commencer');
  }
};

  try { await charger(); } catch (e) { console.error(e); }
  router();
