<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phylactère</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Phylactère">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0B0E1A; --nuit-p:#10152A; --encre:#141A2C; --encre-c:#1A2136;
  --trait:#2E3858; --trait-d:#1F2640; --ivoire:#F3EBDD; --ivoire-d:#C9CEDF;
  --brume:#9AA3BF; --or:#E3B65C; --bleu:#8792BC; --corail:#E8A48A;
  --serif:'Fraunces', Georgia, serif; --sans:'Manrope', system-ui, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--nuit);color:var(--ivoire);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--or)}
.app{display:flex;height:100%;padding-top:var(--safe-t)}
/* Navigation */
nav.rail{width:88px;flex:none;border-right:1px solid var(--trait-d);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px}
.logo span{font-family:var(--serif);font-size:13px;color:var(--ivoire-d);letter-spacing:.02em}
.nav-b{width:68px;padding:10px 0 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--brume);font-size:11.5px;font-weight:600}
.nav-b svg{width:22px;height:22px}
.nav-b[aria-current="true"]{color:var(--or);background:var(--encre)}
.nav-b:hover{color:var(--ivoire)}
.plus-or{width:30px;height:30px;border-radius:50%;background:var(--or);color:var(--nuit);display:grid;place-items:center;font-size:21px;font-weight:600;line-height:1}
/* Édition */
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-size:12.5px;color:var(--brume);font-weight:600}
.form .deux{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .trois{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.inp{width:100%;background:var(--encre);color:var(--ivoire);border:1px solid var(--trait);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;font-weight:400}
.inp:focus{outline:0;border-color:var(--brume)}
textarea.inp{resize:vertical;min-height:90px;line-height:1.5}
input[type=date].inp{color-scheme:dark}
.choix{display:flex;gap:6px;flex-wrap:wrap}
.note-choix button{font-size:22px;color:var(--trait);padding:0 2px;line-height:1}
.note-choix button.on{color:var(--or)}
.barre-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--nuit) 30%);padding:18px 0 4px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn.danger{border-color:rgba(232,164,138,.5);color:var(--corail)}
.mini-x{color:var(--brume);font-size:15px;padding:2px 6px}
.mini-x:hover{color:var(--corail)}
.modif{position:absolute;top:calc(10px + var(--safe-t));right:54px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--trait);display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ivoire-d);background:var(--nuit)}
.modif:hover{border-color:var(--or);color:var(--or)}
.resultat-isbn{display:flex;gap:14px;align-items:flex-start;margin-top:14px}
#scanner{position:fixed;inset:0;z-index:60;background:var(--nuit);display:none;flex-direction:column;padding:calc(12px + var(--safe-t)) 16px calc(14px + var(--safe-b))}
#scanner.ouvert{display:flex}
.sc-haut{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sc-video{position:relative;flex:1;min-height:200px;border-radius:16px;overflow:hidden;background:#000}
.sc-video video{width:100%;height:100%;object-fit:cover;display:block}
.sc-cadre{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.sc-cadre i{width:84%;height:40%;border:2px solid var(--or);border-radius:12px;box-shadow:0 0 0 999px rgba(5,7,14,.45)}
.sc-liste{max-height:30vh;overflow-y:auto;margin-top:12px;display:grid;gap:6px;font-size:14px}
.sc-item{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--encre)}
.sc-bas{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.fil-zone{position:relative;margin-top:18px}
.fil-mois{position:absolute;left:0;width:60px;font-size:11px;letter-spacing:.1em;color:var(--brume);font-weight:600}
.fil-mois::after{content:"";position:absolute;left:64px;top:7px;width:var(--larg);border-top:1px solid var(--trait-d)}
.fil-axe{position:absolute;left:66px;top:0;bottom:0;border-left:1px solid var(--trait)}
.fil-jour{position:absolute;left:58px;width:18px;height:18px;border-radius:50%;background:var(--or);box-shadow:0 0 0 5px rgba(227,182,92,.18)}
.fil-seg{position:absolute;text-align:left;border-radius:10px;background:var(--encre);border:1px solid var(--trait-d);border-left:3px solid var(--ivoire-d);padding:8px 10px;overflow:hidden;display:flex;gap:9px}
.fil-seg:hover{border-color:var(--trait);background:var(--encre-c)}
.fil-seg.en-cours{border-left-color:var(--or)}
.fil-seg .couv{--w:30px;width:30px;align-self:flex-start}
.fil-seg b{font-family:var(--serif);font-weight:400;font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fil-seg small{display:block;font-size:11.5px;color:var(--brume);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.astuce[hidden]{display:none}
.astuce{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--brume)}
.porte{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--trait-d)}
.porte:first-of-type{border-top:0}
#recadreur{position:fixed;inset:0;z-index:70;background:var(--nuit);display:flex;flex-direction:column;padding:calc(12px + var(--safe-t)) 16px calc(14px + var(--safe-b))}
.rc-scene{flex:1;display:grid;place-items:center;min-height:200px;overflow:hidden}
.rc-boite{position:relative;touch-action:none}
.rc-boite canvas{display:block;border-radius:4px}
.rc-cadre{position:absolute;border:2px solid var(--or);box-shadow:0 0 0 9999px rgba(5,7,14,.6);cursor:move;touch-action:none}
.rc-cadre i{position:absolute;width:22px;height:22px;border:3px solid var(--or);background:transparent}
.rc-cadre i[data-c=nw]{left:-4px;top:-4px;border-right:0;border-bottom:0;cursor:nwse-resize}
.rc-cadre i[data-c=ne]{right:-4px;top:-4px;border-left:0;border-bottom:0;cursor:nesw-resize}
.rc-cadre i[data-c=sw]{left:-4px;bottom:-4px;border-right:0;border-top:0;cursor:nesw-resize}
.rc-cadre i[data-c=se]{right:-4px;bottom:-4px;border-left:0;border-top:0;cursor:nwse-resize}
.edition{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:10px;border:1px solid var(--trait-d);margin-top:6px}
.edition:hover{border-color:var(--or)}
/* cartes du ciel en transparence : la carte reste visible dessous */
.bulle-etoile .carte,.terre .carte{background:rgba(20,26,44,.42)!important;border-color:rgba(154,163,191,.28)!important;box-shadow:none!important;-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px)}
.bulle-etoile .carte *,.terre .carte *{text-shadow:0 1px 3px rgba(11,14,26,.95),0 0 8px rgba(11,14,26,.7)}
.bulle-etoile .btn.or,.terre .btn.or,.bulle-etoile .btn.or *,.terre .btn.or *{text-shadow:none}
.bulle-etoile .relies button,.terre .btn:not(.or),.bulle-etoile .btn:not(.or){background:rgba(11,14,26,.35)}
.bulle-etoile .ligne:hover{background:rgba(20,26,44,.5)}
.zone-couv{border:1px dashed transparent;border-radius:12px;padding:6px;margin:-6px}
.zone-couv.survol{border-color:var(--or);background:rgba(227,182,92,.06)}
.mot-btn{border-color:rgba(154,163,191,.45);color:var(--ivoire-d);margin-right:6px}
.mot-btn[aria-pressed="true"]{border-color:var(--or);color:var(--or)}
#mot-carte .carte{max-height:46vh;overflow-y:auto}
.pastille-export{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--or);margin-left:6px;vertical-align:middle}
main{flex:1;min-width:0;position:relative;overflow:hidden}
.vue{position:absolute;inset:0;overflow-y:auto;display:none}
.vue.active{display:block}
#vue-ciel{overflow:hidden}
@media (max-width:820px){
  .form .deux{grid-template-columns:1fr 1fr}
  .app{flex-direction:column}
  nav.rail{order:2;width:100%;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--trait-d);padding:6px 0 calc(6px + var(--safe-b));background:var(--nuit)}
  .logo{display:none}
  .nav-b{width:auto;flex:1;max-width:96px}
}
/* Commun */
.page{max-width:980px;margin:0 auto;padding:22px 20px 60px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:20px}
.sur{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brume);font-weight:600}
.doux{color:var(--brume)}
.carte{background:var(--encre);border:1px solid var(--trait-d);border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--trait);color:var(--ivoire);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--brume)}
.btn.or{background:var(--or);color:var(--nuit);border-color:var(--or)}
.btn.or:hover{filter:brightness(1.08)}
.btn.petit{padding:6px 12px;font-size:13px}
.puce{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--trait);font-size:13px;color:var(--ivoire-d);font-weight:500;white-space:nowrap}
.puce[aria-pressed="true"]{border-color:var(--or);color:var(--or);background:rgba(227,182,92,.08)}
.puce.mot{cursor:pointer}
.puce.mot:hover{border-color:var(--brume);color:var(--ivoire)}
.etoiles{color:var(--or);letter-spacing:1px;font-size:13px}
.statut{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ivoire-d)}
.statut i{width:8px;height:8px;border-radius:50%;display:inline-block}
.s-LU i{background:var(--ivoire)} .s-EN_COURS i{background:var(--or)} .s-A_LIRE i{border:1.5px solid var(--bleu)}
/* Couverture */
.couv{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--encre-c);flex:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.couv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.couv .dessin{position:absolute;inset:0;background:var(--encre);border:1px solid var(--trait);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10%;text-align:center;gap:6%}
.couv .dessin b{font-family:var(--serif);font-weight:400;color:var(--ivoire);line-height:1.15;font-size:calc(var(--w,90px) * .13)}
.couv .dessin small{color:var(--brume);font-size:calc(var(--w,90px) * .09)}
.couv .dessin svg{width:22%;height:auto}

/* Accueil vide */
.vide{max-width:560px;margin:8vh auto;padding:24px;text-align:center}
.vide p{color:var(--ivoire-d);line-height:1.6}
.depot{margin-top:22px;border:1px dashed var(--trait);border-radius:18px;padding:28px 18px}
.depot.survol{border-color:var(--or);background:rgba(227,182,92,.05)}
/* Fiche (appli 1.8) */
.fiche{width:min(560px,100%)}
.rond{width:44px;height:44px;border-radius:50%;border:1px solid var(--trait);display:grid;place-items:center;font-size:18px;color:var(--ivoire);flex:none}
.fc-barre{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
.fc-titre{flex:1;min-width:0;text-align:center;font-size:11px;letter-spacing:2px;color:var(--or);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.fc-titre.replie{font-family:var(--serif);font-size:17px;letter-spacing:0;color:var(--ivoire);font-weight:400}
.fc-defile{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(32px + var(--safe-b))}
.fc-entete{display:flex;gap:14px;padding:4px 20px 16px;align-items:flex-start}
.fc-couv{width:72px;height:108px;border-radius:6px;overflow:hidden;flex:none;background:var(--encre);border:1px solid var(--trait);display:grid;place-items:center}
.fc-couv img{width:100%;height:100%;object-fit:contain;background:var(--nuit)}
.fc-couv span{display:grid;place-items:center;gap:2px;font-size:22px;filter:grayscale(1);opacity:.7}
.fc-couv b{color:var(--or);font-size:11px;filter:none}
.fc-sous{font-size:11px;letter-spacing:1.5px;color:var(--or);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-h{font-size:24px;line-height:1.2;margin:4px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fc-aut{font-size:14px;color:var(--ivoire-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-note-l{display:flex;margin:2px 0 4px}
.fc-note-l button{font-size:20px;color:var(--trait);padding:1px 2px;line-height:1}
.fc-note-l button.on{color:var(--or)}
.fc-statut{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;border-radius:14px;padding:6px 10px;font-size:12.5px;font-weight:600}
.fc-statut i{width:8px;height:8px;border-radius:50%;border:1px solid currentColor;background:currentColor}
.fc-statut span{color:var(--brume)}
.fc-statut.s-LU{color:var(--ivoire)} .fc-statut.s-EN_COURS{color:var(--or)} .fc-statut.s-A_LIRE{color:var(--bleu)} .fc-statut.s-A_LIRE i{background:none}
.menu-liste.gauche{left:0;right:auto}
.fc-onglets{position:sticky;top:0;z-index:2;background:var(--nuit);display:flex;gap:20px;padding:0 20px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--trait-d)}
.fc-onglets::-webkit-scrollbar{display:none}
.fc-onglets button{padding:6px 0 10px;font-size:14px;font-weight:600;color:var(--brume);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.fc-onglets button[aria-selected="true"]{color:var(--ivoire);border-color:var(--or)}
.fc-page{display:flex;flex-direction:column;gap:16px;padding-top:16px;min-height:60vh}
.fc-page>*{margin-left:20px;margin-right:20px}
.fc-page>.fc-etiq,.fc-page>.fc-rub,.fc-page>.fc-lienpage{margin-left:0;margin-right:0}
.fc-rub{font-size:11px;letter-spacing:2px;color:var(--brume);font-weight:600;padding:4px 20px 0}
.fc-lab{font-size:11px;letter-spacing:2px;color:var(--brume);font-weight:600}
.fc-lab.or,.fc-or{color:var(--or)}
.fc-petit{font-size:12.5px;color:var(--brume)}
.fc-discret{color:var(--brume);font-size:14px;margin:0 20px !important;line-height:1.5}
.fc-discret0{color:var(--brume);font-size:14px;margin:0;line-height:1.5}
.fc-texte{color:var(--ivoire-d);font-size:14px;line-height:1.5;margin:0}
.fc-erreur{color:var(--corail);font-size:12.5px;margin:0}
.fc-charge{display:flex;align-items:center;gap:10px;color:var(--brume);font-size:14px}
.rouet{width:16px;height:16px;border-radius:50%;border:2px solid var(--or);border-right-color:transparent;animation:tourne .8s linear infinite;flex:none}
@keyframes tourne{to{transform:rotate(360deg)}}
.fc-lienpage{align-self:flex-start;color:var(--or);font-weight:600;font-size:14px;padding:6px 8px;margin:0 12px !important;border-radius:8px}
.fc-lienpage:hover{background:var(--encre)}
.fc-ligne{display:flex;align-items:center}
.fc-col{display:flex;flex-direction:column;align-items:flex-end}
.fc-bloc{display:flex;flex-direction:column;gap:10px}
.fc-etiq{display:flex;gap:6px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.fc-etiq::-webkit-scrollbar{display:none}
.etq{flex:none;font-size:12.5px;font-weight:600;color:var(--ivoire-d);border:1px solid var(--trait-d);border-radius:14px;padding:6px 10px;white-space:nowrap}
.etq.or{color:var(--or);border-color:var(--or)}
.fc-gros{display:flex;justify-content:center;align-items:center;background:var(--or);color:var(--nuit);font-weight:700;font-size:15px;border-radius:999px;padding:14px;cursor:pointer}
.fc-gros.petit{padding:10px;font-size:14px;flex:1}
.fc-gros:disabled,.fc-gros.off{opacity:.45;pointer-events:none}
.fc-contour{display:flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--trait);border-radius:999px;padding:10px;font-weight:600;font-size:14px;color:var(--ivoire);flex:1;cursor:pointer;text-align:center}
.fc-contour:disabled{color:var(--brume);opacity:.6}
.fc-contour.large{flex:none}
.fc-deux{display:flex;gap:10px}
.fc-txtbtn{color:var(--brume);font-weight:600;font-size:14px;padding:8px 10px;border-radius:8px;white-space:nowrap}
.fc-txtbtn.or{color:var(--or)}
.fc-txtbtn:disabled{opacity:.4}
.fc-txtbtn:hover{background:rgba(154,163,191,.08)}
.fc-carte{background:var(--encre);border-radius:14px;padding:10px 4px 10px 14px}
.fc-dates{display:flex;align-items:center;gap:10px}
.fc-dates>i{width:9px;height:9px;border-radius:50%;flex:none}
.fc-crayon{color:var(--or);font-size:18px;padding:8px 12px}
.fc-note{display:grid;gap:6px;text-align:left;background:#080B15;border-radius:14px;padding:14px}
.fc-extrait{font-size:14px;line-height:1.5;color:var(--ivoire);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.fc-resume7{font-size:14px;line-height:1.5;color:var(--ivoire-d);display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.fc-bandeau{display:flex;align-items:center;border-radius:14px;background:var(--encre);padding:6px 4px 6px 14px}
.fc-bandeau.or{background:none;border:1px solid var(--or)}
.fc-prog{display:flex;flex-direction:column;gap:10px;background:var(--encre);border:1px solid var(--or);border-radius:16px;padding:16px}
.fc-pct{font-family:var(--serif);font-size:22px;color:var(--or)}
.fc-champ{display:grid;gap:2px;font-size:11px;color:var(--brume);font-weight:600}
.fc-champ input{width:96px;background:var(--nuit);color:var(--ivoire);border:1px solid var(--trait);border-radius:8px;padding:9px 10px;font:inherit;font-size:15px}
.fc-plus{border:1px solid var(--trait);border-radius:14px;padding:8px 14px;font-weight:600;font-size:14px}
.fc-jauge{height:6px;border-radius:3px;background:var(--trait);overflow:hidden}
.fc-jauge i{display:block;height:100%;background:var(--or)}
.fc-citation{display:flex;flex-direction:column;background:#080B15;border-radius:14px;border-left:3px solid var(--or);padding:14px 4px 0 14px;cursor:pointer}
.fc-cit-t{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.4;color:var(--ivoire)}
.fc-cit-b{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--brume)}
.fc-cit-b button{color:var(--brume);font-weight:600;padding:10px 12px}
.fc-sugg{display:flex;align-items:center;gap:12px;background:var(--encre);border-radius:14px;padding:12px;text-decoration:none;color:inherit}
.fc-sugg img,.fc-sugg-v{width:42px;height:63px;border-radius:4px;object-fit:cover;flex:none;background:#080B15;display:grid;place-items:center;color:var(--bleu)}

/* ---------------- Stockage local (IndexedDB) ---------------- */
const Base = {
  db: null,
  async ouvrir(){
    if (this.db) return this.db;
    this.db = await new Promise((ok, ko) => {
      const r = indexedDB.open('phylactere', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('donnees'); r.result.createObjectStore('couvertures'); };
      r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
    });
    return this.db;
  },
  async tx(store, mode, fn){
    const db = await this.ouvrir();
    return new Promise((ok, ko) => { const t = db.transaction(store, mode); const res = fn(t); t.oncomplete = () => ok(res && res.result !== undefined ? res.result : res); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); });
  },
  async lire(){
    try { const db = await this.ouvrir(); return await new Promise((ok, ko) => { const r = db.transaction('donnees', 'readonly').objectStore('donnees').get('racine'); r.onsuccess = () => ok(r.result || null); r.onerror = () => ko(r.error); }); }
    catch(e){ console.warn(e); return null; }
  },
  async couvertures(){
    try {
      const db = await this.ouvrir();
      return await new Promise((ok, ko) => { const m = new Map(); const t = db.transaction('couvertures','readonly'); const c = t.objectStore('couvertures').openCursor(); c.onsuccess = () => { const k = c.result; if (k) { m.set(k.key, k.value); k.continue(); } }; t.oncomplete = () => ok(m); t.onerror = () => ko(t.error); });
    } catch(e){ return new Map(); }
  },
  async remplacer(racine, fichiers){
    const db = await this.ouvrir();
    await new Promise((ok, ko) => {
      const t = db.transaction(['donnees','couvertures'], 'readwrite');
      t.objectStore('donnees').put(racine, 'racine');
      const s = t.objectStore('couvertures'); s.clear();
      for (const [nom, blob] of fichiers) s.put(blob, nom);
      t.oncomplete = ok; t.onerror = () => ko(t.error); t.onabort = () => ko(t.error);
    });
  },
  async ecrireDonnees(racine){ await this.tx('donnees','readwrite', t => t.objectStore('donnees').put(racine, 'racine')); },
  async ecrireCouverture(nom, blob){ await this.tx('couvertures','readwrite', t => t.objectStore('couvertures').put(blob, nom)); },
  async supprimerCouverture(nom){ await this.tx('couvertures','readwrite', t => t.objectStore('couvertures').delete(nom)); },
  async lireCouverture(nom){ const db = await this.ouvrir(); return new Promise((ok, ko) => { const r = db.transaction('couvertures', 'readonly').objectStore('couvertures').get(nom); r.onsuccess = () => ok(r.result || null); r.onerror = () => ko(r.error); }); },
  async effacer(){ const db = await this.ouvrir(); await new Promise((ok, ko) => { const t = db.transaction(['donnees','couvertures'],'readwrite'); t.objectStore('donnees').clear(); t.objectStore('couvertures').clear(); t.oncomplete = ok; t.onerror = () => ko(t.error); }); }
};

/* ---------------- Lecture du .zip de sauvegarde (sans bibliothèque) ---------------- */
async function lireZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let fin = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { fin = i; break; }
  if (fin < 0) throw new Error('Ce fichier n’est pas un .zip lisible');
  const n = dv.getUint16(fin + 10, true); let p = dv.getUint32(fin + 16, true);
  const entrees = [];
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const methode = dv.getUint16(p + 10, true), taille = dv.getUint32(p + 20, true);
    const ln = dv.getUint16(p + 28, true), le = dv.getUint16(p + 30, true), lc = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const nom = dec.decode(u8.subarray(p + 46, p + 46 + ln));
    entrees.push({ nom, methode, taille, local });
    p += 46 + ln + le + lc;
  }
  const lire = async e => {
    const d = e.local + 30 + dv.getUint16(e.local + 26, true) + dv.getUint16(e.local + 28, true);
    const brut = u8.slice(d, d + e.taille);
    if (e.methode === 0) return brut.buffer;
    if (e.methode !== 8) throw new Error('Compression non prise en charge');
    return new Response(new Blob([brut]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
  };
  return { entrees, lire };
}

async function importerSauvegarde(fichier){
  const zip = await lireZip(await fichier.arrayBuffer());
  const json = zip.entrees.find(e => e.nom === 'donnees.json');
  if (!json) throw new Error('Ce fichier n’est pas une sauvegarde Phylactère');
  const racine = JSON.parse(new TextDecoder().decode(await zip.lire(json)));
  if (racine.application !== 'Phylactère') throw new Error('Ce fichier n’est pas une sauvegarde Phylactère');
  const fichiers = [];
  for (const e of zip.entrees) {
    if (!e.nom.startsWith('couvertures/') || e.nom.endsWith('/')) continue;
    const nom = e.nom.split('/').pop();
    const type = /\.png$/i.test(nom) ? 'image/png' : /\.webp$/i.test(nom) ? 'image/webp' : 'image/jpeg';
    fichiers.push([nom, new Blob([await zip.lire(e)], { type })]);
  }
  // comme l'appli : une sauvegarde sans galaxies (format 3 ou moins) ne les efface pas
  if (!Array.isArray(racine.galaxies)) { const avant = await Base.lire(); racine.galaxies = (avant && avant.galaxies) || []; }
  racine.importeLe = Date.now(); racine.fichierSource = fichier.name;
  await Base.remplacer(racine, fichiers);
  return { lectures: (racine.lectures || []).length, citations: (racine.citations || []).length, liens: (racine.liens || []).length, couvertures: fichiers.length };
}

/* ---------------- Modèle en mémoire ---------------- */
const M = { racine:null, lectures:[], parId:new Map(), citations:[], liens:[], urlsCouv:new Map() };

function themeDe(l){ return (l.theme && l.theme.trim()) || (l.type === 'BD' ? 'Bande dessinée' : ''); }
function titreProvisoire(t){ const s = (t || '').trim(); return !s || /^isbn\b/i.test(s) || /^[\d\s-]{8,}$/.test(s); }
function manques(l){ const m = []; if (titreProvisoire(l.titre)) m.push('titre'); if (!(l.auteur || '').trim()) m.push('auteur'); if (!themeDe(l)) m.push('thème'); return m; }
function motsDe(l){ return (l.motsCles || '').split(/[,;/]/).map(s => s.trim()).filter(Boolean); }
function titreCourt(l){ let t = (l.titre || '').split(/\s[:–—]\s|\s:\s?/)[0].trim() || l.titre; if (l.tome) t += ` · t. ${l.tome}`; return t; }
function titreComplet(l){ return l.tome && l.serie ? `${l.titre}` : l.titre; }
const ARTICLES = /^(le |la |les |l'|l’|un |une |des |du |the |a |an )/i;
function cleTitre(l){ return norm(l.titre).replace(ARTICLES, ''); }
function premierAuteur(l){ return (l.auteur || '').split(/,|;| et /)[0].replace(/\([^)]*\)/g, '').replace(/\b(dir|éd|trad)\.?$/i, '').trim(); }
function nomFamille(l){ const a = premierAuteur(l).replace(/\b(jr\.?|sr\.?)$/i, '').trim(); const p = a.split(/\s+/); return p[p.length - 1] || ''; }

async function charger(){
  const racine = await Base.lire();
  M.urlsCouv.forEach(u => URL.revokeObjectURL(u)); M.urlsCouv.clear();
  if (!racine) { M.racine = null; M.lectures = []; M.parId = new Map(); M.citations = []; M.liens = []; return; }
  const couv = await Base.couvertures();
  couv.forEach((blob, nom) => M.urlsCouv.set(nom, URL.createObjectURL(blob)));
  M.racine = racine;
  M.lectures = (racine.lectures || []).map(l => ({ ...l }));
  M.citations = (racine.citations || []).map(c => ({ ...c }));
  M.liens = (racine.liens || []).map(x => ({ ...x }));
  indexer();
}
function indexer(){
  M.parId = new Map(M.lectures.map(l => [l.id, l]));
  M.citations = M.citations.filter(c => M.parId.has(c.lectureId));
  M.liens = M.liens.filter(x => M.parId.has(x.lectureA) && M.parId.has(x.lectureB) && x.lectureA !== x.lectureB);
  for (const l of M.lectures) { l._mots = motsDe(l); l._motsN = new Set(l._mots.map(norm)); l._manques = manques(l); l._theme = themeDe(l); l._cit = 0; l._liens = []; }
  for (const c of M.citations) M.parId.get(c.lectureId)._cit++;
  for (const x of M.liens) { M.parId.get(x.lectureA)._liens.push({ id:x.lectureB, raison:x.raison }); M.parId.get(x.lectureB)._liens.push({ id:x.lectureA, raison:x.raison }); }
}

function srcCouverture(l){
  const u = l.couvertureUrl; if (!u) return null;
  if (u.startsWith('local:')) return M.urlsCouv.get(u.slice(6)) || null;
  if (u.startsWith('http://')) return 'https://' + u.slice(7);
  if (u.startsWith('https://')) return u;
  return null;
}

    const nb = c => M.lectures.filter(c).length;
    const puces = [['TOUS','Tous'],['EN_COURS','En cours'],['A_LIRE','À lire'],['LU','Lus'],['LIVRE','Livres'],['BD','BD'],['COMPLETER',`À compléter · ${nb(l => l._manques.length)}`]];

      <select class="select" id="tri" aria-label="Trier">${[['ajout','Date d’ajout'],['titre','Titre'],['auteur','Auteur'],['debut','Début de lecture'],['fin','Fin de lecture'],['theme','Thème'],['serie','Série'],['note','Note']].map(([k, t]) => `<option value="${k}" ${this.tri === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>`;
    if (f === 'COMPLETER') h += `<p class="doux" style="font-size:13.5px;line-height:1.5">Ces fiches n’entrent ni dans le ciel tant qu’il leur manque un titre, un auteur ou un thème. Leurs citations restent dans le carnet.</p>`;
    h += `<div class="doux" style="font-size:12.5px;margin:10px 0">${ls.length} livre${ls.length > 1 ? 's' : ''}</div>`;
    if (!ls.length) return h + `<p class="doux">Aucun livre ne correspond.</p>`;
    const tri = this.tri; let section = null;
    const cmp = {
      ajout: (a, b) => (b.dateAjout || 0) - (a.dateAjout || 0),
      titre: (a, b) => cleTitre(a).localeCompare(cleTitre(b), 'fr') || (a.tome ?? 0) - (b.tome ?? 0),
      auteur: (a, b) => norm(nomFamille(a) || '~').localeCompare(norm(nomFamille(b) || '~'), 'fr') || norm(a.serie || '').localeCompare(norm(b.serie || '')) || (a.tome ?? 0) - (b.tome ?? 0) || cleTitre(a).localeCompare(cleTitre(b), 'fr'),

    ls.sort(cmp);

    }

  }
};

/* Series.kt */
const Series = (() => {
  const formeBnf = /^(.+?)\.\s+(\d{1,3})\s*(?:[,:]\s*(.+))?$/u;
  const formeTome = /^(.+?)\s*[-–:,.(]?\s*\b(?:tome|t\.?|vol\.?|volume|livre|épisode|ep\.?)\s*0*(\d{1,3})\)?\s*(?:[-–:,.]\s*(.+))?$/iu;
  const formeCrochets = /^(.+?)\.?\s*\[([IVXLC]{1,6}|\d{1,3})\]\s*(?:[,:.]\s*(.+))?$/u;
  function romain(s){ if (/^\d+$/.test(s)) return +s; const v = { I: 1, V: 5, X: 10, L: 50, C: 100 }; let t = 0; for (let i = 0; i < s.length; i++) { const a = v[s[i]]; if (!a) return null; const b = v[s[i + 1]] || 0; t += a < b ? -a : a; } return t > 0 ? t : null; }
  function nettoyerSerie(b){ if (b == null) return null; const s = b.replace(/^[\p{M}\p{P}\s]+/u, '').trim().replace(/[-–,.: ]+$/, ''); return s.length >= 2 && /\p{L}/u.test(s) ? s : null; }
  function analyser(t0){
    const t = String(t0 || '').trim();
    let m = formeCrochets.exec(t);
    if (m) { const serie = nettoyerSerie(m[1]), tome = romain(m[2]); if (serie && tome > 0) return { serie, tome, titre: (m[3] || '').trim() || serie }; }
    for (const f of [formeBnf, formeTome]) {
      m = f.exec(t); if (!m) continue;
      const serie = nettoyerSerie(m[1]); if (!serie) continue;
      const tome = +m[2]; if (!tome) continue;
      return { serie, tome, titre: (m[3] || '').trim() || serie };
    }
    return { serie: null, tome: null, titre: t };
  }
  const manquants = tomes => { if (!tomes.length) return []; const mx = Math.max(...tomes), s = new Set(tomes); const r = []; for (let i = 1; i <= mx; i++) if (!s.has(i)) r.push(i); return r; };
  return { analyser, manquants };
})();

})();

/* Suggestions.kt : livres proches en ligne (Open Library puis Google Books), gardés le temps de la visite */
const Suggestions = (() => {
  const cache = new Map();
  const GEN = ["fiction", "general", "literature", "litterature", "novel", "roman", "romans", "american fiction", "english fiction", "french fiction", "fiction in english", "large type", "accessible book", "protected daisy", "in library", "lending library", "open library", "staff picks", "bestseller", "best seller", "award", "prize", "reading level", "translations", "translated", "language materials", "textbooks", "classics", "classic literature", "literary", "fiction, general", "fiction / general", "nyt", "new york times", "long now", "book club", "readers", "english language", "american literature", "french literature", "english literature", "domestic fiction", "litterature americaine", "litterature anglaise", "litterature francaise", "traduction", "roman americain", "roman anglais", "roman francais", "romans, nouvelles", "ouvrages", "etude et enseignement"];
  const sansAcc = s => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const n = s => sansAcc(String(s || '')).replace(/[^a-z0-9]/g, '');
  const estGen = s => { const x = sansAcc(s).trim(); return x.length < 4 || x.length > 50 || GEN.some(g => x === g || x.includes(g)) || x.includes('=') || x.includes(':'); };
  const memeLivre = (a, b) => { const na = n(a), nb = n(b); return !!na && !!nb && (na === nb || na.startsWith(nb) || nb.startsWith(na)); };
  const memeAuteur = (a, b) => { const nb = n(String(b || '').split(',')[0]); return !!nb && n(a).includes(nb); };
  const latin = s => { const l = [...s].filter(c => /\p{L}/u.test(c)); return !l.length || l.filter(c => /\p{Script=Latin}/u.test(c)).length * 4 >= l.length * 3; };
  let recu = false;
  async function lire(url){ try { const r = await fetch(url, { signal: AbortSignal.timeout(8000) }); if (!r.ok) return null; recu = true; return await r.json(); } catch (e) { return null; } }
  const tx = a => Array.isArray(a) ? a.filter(x => x && String(x).trim()) : [];
  async function sujets(l){
    const urls = []; if (l.isbn) urls.push(`https://openlibrary.org/search.json?isbn=${l.isbn}&fields=subject&limit=1`);
    urls.push('https://openlibrary.org/search.json?title=' + encodeURIComponent(l.titre) + (l.auteur ? '&author=' + encodeURIComponent(l.auteur.split(',')[0]) : '') + '&fields=subject&limit=3');
    const s = new Set();
    for (const u of urls) { const j = await lire(u); if (!j) continue; for (const d of j.docs || []) tx(d.subject).filter(x => !estGen(x)).forEach(x => s.add(x.trim())); if (s.size >= 4) break; }
    return [...s].slice(0, 4);
  }
  async function parSujet(sujet, jeunesse){
    const j = await lire('https://openlibrary.org/search.json?subject=' + encodeURIComponent(sujet) + '&language=fre&lang=fr&fields=title,author_name,cover_i,subject,editions,editions.title,editions.language&limit=25'); if (!j) return [];
    return (j.docs || []).map(d => {
      const ed = d.editions && d.editions.docs && d.editions.docs[0], to = d.title; if (!to) return null;
      let titre; if (!d.editions) titre = to; else if (ed && tx(ed.language).includes('fre')) titre = ed.title || to; else return null;
      if (!jeunesse && /juvenile|children|young adult/.test(tx(d.subject).join(' ').toLowerCase())) return null;
      const auteur = tx(d.author_name).slice(0, 2).join(', ');
      return { titre, auteur, couvertureUrl: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : null };
    }).filter(Boolean);
  }
  async function google(q){ const j = await lire('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(q) + '&printType=books&orderBy=relevance&maxResults=20&langRestrict=fr'); return (j && j.items || []).map(i => i.volumeInfo || {}).filter(v => v.title).map(v => ({ titre: v.title, auteur: tx(v.authors).join(', '), couvertureUrl: v.imageLinks && v.imageLinks.thumbnail ? v.imageLinks.thumbnail.replace('http://', 'https://') : null })); }
  function ajouter(t, l, cands, memeA){ for (const c of cands) { if (t.length >= 5) return; if (!latin(c.titre) || memeLivre(c.titre, l.titre) || (!memeA && memeAuteur(c.auteur, l.auteur)) || t.some(x => memeLivre(x.titre, c.titre))) continue; t.push(c); } }
  async function chercher(l){
    recu = false; const t = []; let criteres = null;
    const sj = await sujets(l);
    if (sj.length) {
      criteres = sj.join(' · ');
      const jeunesse = /jeunesse/i.test(l.theme || ''), scores = new Map();
      for (const s of sj) for (const c of await parSujet(s, jeunesse)) { const k = n(c.titre), a = scores.get(k); scores.set(k, [a ? a[0] : c, (a ? a[1] : 0) + 1]); }
      const min = sj.length >= 2 ? 2 : 1;
      ajouter(t, l, [...scores.values()].filter(x => x[1] >= min).sort((a, b) => b[1] - a[1] || (!!b[0].couvertureUrl - !!a[0].couvertureUrl)).map(x => x[0]));
    }
    if (t.length < 5 && l.auteur) { const av = t.length; ajouter(t, l, await google(`inauthor:"${l.auteur.split(',')[0].trim()}"`), true); if (!criteres && t.length > av) criteres = 'Du même auteur'; }
    return { criteres, livres: t.slice(0, 5), erreurReseau: !recu };
  }
  const cle = l => `${l.id}|${l.titre}|${l.auteur}|${l.isbn}`;
  async function pour(l){ const k = cle(l); if (cache.has(k)) return cache.get(k); const r = await chercher(l); if (!r.erreurReseau) cache.set(k, r); return r; }
  return { pour, oublier: l => cache.delete(cle(l)), memeLivre };
})();

  /* ---------- livres proches dans ta bibliothèque (FicheScreen.livresProches) ---------- */
  function livresProches(l){

        <div class="fc-rangee">${tomes.map(t => `<button class="fc-tome${t.id === l.id ? ' actuel' : ''}" ${t.id === l.id ? 'disabled' : `data-livre="${t.id}"`}><b>${t.tome != null ? 'T' + t.tome : '—'}</b><span>${esc(t.titre)}</span></button>`).join('')}</div>

  function pageProches(l, st){

    else h += `<div class="fc-bloc">${miniConstellation(l, s.livres.slice(0, 3))}${s.criteres ? `<div class="fc-petit">D’après : ${esc(s.criteres)}</div>` : ''}</div>` + s.livres.map(carteSugg).join('');
    h += rub('EXPLORER AILLEURS') + `<div class="fc-deux"><a class="fc-contour" href="${esc(Liens.babelio(l.titre, l.auteur))}" target="_blank" rel="noopener">Babelio ↗</a>${l.auteur ? `<a class="fc-contour" href="${esc(Liens.literatureMap(l.auteur))}" target="_blank" rel="noopener">Literature Map</a>` : '<button class="fc-contour" disabled>Literature Map</button>'}</div>`;

    return h;
  }

  /* ---------- rendu ---------- */
  function rendre(){
    const l = livre, st = E(l.id), nbCit = l._cit;
    const sousTitre = l.serie && l.serie.trim() ? l.serie + (l.tome != null ? ' · Tome ' + l.tome : '') : null;

        <div class="menu-wrap"><button class="rond" data-a="menu" aria-label="Plus d’options">⋯</button><div class="menu-liste" ${menuOuvert ? '' : 'hidden'}><button data-a="modifier">Modifier la fiche</button><button data-a="${l.pretA ? 'rendu' : 'preter'}">${l.pretA ? 'Il m’a été rendu' : 'Prêter ce livre'}</button><button data-a="partager">Partager mes notes</button><button data-a="couverture">Changer la couverture</button><button data-a="supprimer" style="color:var(--corail)">Supprimer ce livre</button></div></div></div>
      <div class="fc-defile"><div class="fc-entete" id="fc-entete">
        <button class="fc-couv" data-a="couverture" aria-label="Couverture — toucher pour la changer">${couv ? `<img src="${esc(couv)}" alt="" referrerpolicy="no-referrer">` : `<span>${l.type === 'BD' ? '💬' : '📖'}<b>＋</b></span>`}</button>
        <div style="flex:1;min-width:0">${sousTitre ? `<div class="fc-sous">${esc(sousTitre.toUpperCase())}</div>` : ''}<h2 class="fc-h">${esc(l.titre)}</h2>${l.auteur ? `<div class="fc-aut">${esc(l.auteur)}</div>` : ''}
          <div class="fc-note-l">${[1, 2, 3, 4, 5].map(i => `<button data-note="${i}" class="${i <= l.note ? 'on' : ''}" aria-label="${i} sur 5">${i <= l.note ? '✦' : '✧'}</button>`).join('')}</div>
          <div class="fc-ligne" style="gap:6px"><div class="menu-wrap"><button class="fc-statut s-${l.statut}" data-a="statut"><i></i>${LIB_STATUT[l.statut]}<span>  ▾</span></button><div class="menu-liste gauche" hidden id="fc-menu-statut">${['A_LIRE', 'EN_COURS', 'LU'].map(s => `<button data-statut="${s}">${s === l.statut ? '✓  ' : '     '}${LIB_STATUT[s]}</button>`).join('')}</div></div><span class="fc-petit">${l.type === 'BD' ? 'BD' : 'Livre'}</span>${l.relectures > 0 ? `<span class="fc-petit">· relu ${l.relectures} fois</span>` : ''}</div>
        </div></div>

        <div class="fc-page" role="tabpanel">${[pageLecture, pageNotes, pageCitations, pageLivre, pageProches][page](l, st)}</div></div>`;

    const d = el.querySelector('.fc-defile'); d.scrollTop = defAvant; suivreTitre();
  }
  function suivreTitre(){
    const d = el.querySelector('.fc-defile'), t = $('#fc-titre'), e = $('#fc-entete'); if (!d || !t || !e) return;
    const replie = d.scrollTop >= e.offsetHeight; t.classList.toggle('replie', replie);
    t.textContent = replie ? livre.titre : 'CONSTELLATION ' + CC.nomConstellation(livre).toUpperCase();
  }
  function allerA(i){
    page = i; const d = el.querySelector('.fc-defile'), e = $('#fc-entete'); const garde = Math.min(d.scrollTop, e.offsetHeight);
    rendre(); el.querySelector('.fc-defile').scrollTop = garde; suivreTitre();
  }
  let minuteNotes = null;
  function brancher(){
    const l = livre, st = E(l.id), q = s => el.querySelectorAll(s), on = (s, f) => q(s).forEach(b => b.onclick = f.bind(null, b));
    el.querySelector('.fc-defile').addEventListener('scroll', suivreTitre, { passive: true });

    on('[data-cit]', (b, e) => { if (e.target.closest('[data-supcit]')) return; editeurCitation(l, M.citations.find(c => c.id === +b.dataset.cit)); });
    on('[data-relier]', async (b, e) => { e.stopPropagation(); await Edition.relierLivres([[l.id, +b.dataset.relier]], b.dataset.raison); rendre(); });
    on('[data-delier]', (b, e) => { e.stopPropagation(); confirmer('Défaire ce lien ?', 'Les deux livres restent dans ta bibliothèque, seul le lien disparaît.', 'Défaire', async () => { M.liens = M.liens.filter(x => x.id !== +b.dataset.delier); await sauver(); rendre(); }); });
    on('[data-ajmot]', async b => { const a = String(l.motsCles || '').trim().replace(/,+$/, ''); l.motsCles = a ? `${a}, ${b.dataset.ajmot}` : b.dataset.ajmot; await sauver(); rendre(); });
    on('[data-plus]', async b => { const n = +b.dataset.plus, t = l.pagesTotal || null, v = (l.pageActuelle || 0) + n; l.pageActuelle = t ? Math.min(v, t) : v; await sauver(); rendre(); });

    q('[data-photo-cit]').forEach(i => i.onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; st.erreur = null; const t = await Edition.lireTexteImage(f, 'Citation', 'Encadre le passage à garder.', m => toast(m)); if (t == null) return; if (!t) { st.erreur = 'Aucun texte lu. Réessaie avec plus de lumière, la page bien à plat.'; rendre(); return; } editeurCitation(l, null, t); });
    q('[data-photo-4e]').forEach(i => i.onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; st.msg4e = null; st.lec4e = 'Lecture du texte de la photo…'; rendre();
      const t = await Edition.lireTexteImage(f, '4e de couverture', 'Encadre le texte du résumé.', m => { st.lec4e = m; const z = el.querySelector('.fc-charge'); if (z) z.lastChild.textContent = m; });
      st.lec4e = null; if (t == null) { rendre(); return; } if (!t) st.msg4e = 'Aucun texte lu. Réessaie avec plus de lumière, la 4e bien à plat.'; else { l.resume = t; l.sourceResume = 'Ta photo'; await sauver(); } rendre(); });
    const notes = $('#fc-notes');
    if (notes) {
      notes.oninput = () => { clearTimeout(minuteNotes); $('#fc-notes-etat').textContent = 'Enregistrement automatique'; minuteNotes = setTimeout(async () => { l.notes = notes.value; await sauver(); const e = $('#fc-notes-etat'); if (e) e.textContent = 'Enregistré'; }, 800); };
      Dictee.brancher($('#fc-dicter-notes'), notes);
    }
    const r4 = $('#fc-4e'); if (r4) { r4.oninput = () => { clearTimeout(minuteNotes); minuteNotes = setTimeout(async () => { l.resume = r4.value; if (!l.sourceResume) l.sourceResume = 'Saisie'; await sauver(); }, 800); }; Dictee.brancher($('#fc-dicter-4e'), r4); }
    on('[data-a]', async (b, e) => {
      const a = b.dataset.a;
      if (a !== 'menu' && a !== 'statut') { q('.menu-liste').forEach(m => m.hidden = true); menuOuvert = false; }
      switch (a) {
        case 'retour': enregistrerEnCours(); fermer(); break;
        case 'menu': e.stopPropagation(); menuOuvert = !menuOuvert; b.nextElementSibling.hidden = !menuOuvert; break;
        case 'statut': e.stopPropagation(); $('#fc-menu-statut').hidden = !$('#fc-menu-statut').hidden; break;
        case 'modifier': enregistrerEnCours(); panneauModifier(l); break;
        case 'preter': dialoguePret(l); break;
        case 'rendu': rendreLivre(l); break;
        case 'partager': partager(l); break;
        case 'couverture': enregistrerEnCours(); Edition.ouvrir(l.id, { couverture: true }); break;
        case 'supprimer': confirmer('Supprimer ce livre ?', `« ${l.titre} », ses notes et ses ${l._cit} citation(s) seront définitivement supprimés.`, 'Supprimer', async () => { await Edition.supprimerDirect(l.id); fermer(); }); break;
        case 'completer': completer(l); break;
        case 'commencer': changerStatut(l, 'EN_COURS'); break;
        case 'terminer': terminer(l); break;
        case 'relire': relire(l); break;
        case 'dicter-note': allerA(1); setTimeout(() => { const bt = $('#fc-dicter-notes'); if (bt && !bt.hidden) bt.click(); else $('#fc-notes')?.focus(); }, 50); break;
        case 'saisir-cit': editeurCitation(l, null); break;
        case 'modif4e': st.modif4e = !st.modif4e; if (!st.modif4e && $('#fc-4e')) { l.resume = $('#fc-4e').value; await sauver(); } rendre(); break;
        case 'effacer4e': l.resume = ''; l.sourceResume = null; await sauver(); rendre(); break;
        case 'chercher4e': chercher4e(l); break;
        case 'appliquer-serie': l.titre = b.dataset.ti; l.serie = b.dataset.s; l.tome = +b.dataset.t; await sauver(); rendre(); break;
        case 'nouveau-lien': dialogueLien(l); break;
        case 'reessayer': st.essai++; st.sugg = null; Suggestions.oublier(l); rendre(); chargerSuggestions(l); break;
      }
    });
    // glisser d'une page à l'autre, comme dans l'appli
    const zone = el.querySelector('.fc-page'); let d0 = null;
    zone.addEventListener('touchstart', e => { if (e.touches.length === 1 && !e.target.closest('.fc-rangee,textarea,input')) d0 = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
    zone.addEventListener('touchend', e => { if (!d0) return; const t = e.changedTouches[0], dx = t.clientX - d0[0], dy = t.clientY - d0[1]; d0 = null; if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) { const n = page + (dx < 0 ? 1 : -1); if (n >= 0 && n < ONGLETS.length) allerA(n); } }, { passive: true });
  }
  document.addEventListener('click', e => { if (!ouverte || e.target.closest('.menu-wrap')) return; el.querySelectorAll('.menu-liste').forEach(m => m.hidden = true); menuOuvert = false; });
  function enregistrerEnCours(){
    const l = livre; if (!l) return; let ch = false;
    const n = $('#fc-notes'); if (n && n.value !== (l.notes || '')) { l.notes = n.value; ch = true; }
    const r = $('#fc-4e'); if (r && r.value !== (l.resume || '')) { l.resume = r.value; ch = true; }
    clearTimeout(minuteNotes); if (ch) sauver();
  }
  async function chercher4e(l){
    const st = E(l.id); st.rech4e = true; st.msg4e = null; rendre();
    let r = null; try { if (l.isbn) r = await Edition.chercherIsbn(String(l.isbn).replace(/[^0-9X]/gi, '')); } catch (e) {}
    st.rech4e = false;
    if (r && r.resume) { l.resume = r.resume; l.sourceResume = r.source; await sauver(); }
    else st.msg4e = !l.isbn ? 'Pas d’ISBN pour ce livre : photographie la 4e de couverture.' : 'Aucune 4e trouvée en ligne. Photographie-la : c’est la méthode la plus sûre.';
    if (livre && livre.id === l.id) rendre();
  }
  async function chargerSuggestions(l){
    const st = E(l.id); if (st.sugg) return;
    st.sugg = null; const r = await Suggestions.pour(l); st.sugg = r;

  }
  async function auto(l){
    const st = E(l.id); if (st.auto) return; st.auto = true;
    if (l.isbn && (!String(l.motsCles || '').trim() || !String(l.resume || '').trim())) {
      try { const r = await Edition.chercherIsbn(String(l.isbn).replace(/[^0-9X]/gi, '')); let ch = false;
        if (r && !String(l.motsCles || '').trim() && r.motsCles?.length) { l.motsCles = r.motsCles.join(', '); ch = true; }
        if (r && !String(l.resume || '').trim() && r.resume) { l.resume = r.resume; l.sourceResume = r.source; ch = true; }
        if (ch) { await sauver(); if (ouverte && livre && livre.id === l.id) rendre(); } } catch (e) {}
    }
  }

  /* ---------- fenêtres ---------- */
  function dialogue(html, brancherD){ const d = $('#dialogue'); d.innerHTML = `<div class="carte" style="max-width:460px;width:100%">${html}</div>`; d.classList.add('ouvert'); const f = () => d.classList.remove('ouvert'); brancherD(d, f); return f; }
  function dialoguePret(l){
    dialogue(`<h2 style="font-size:19px">Prêter « ${esc(l.titre)} »</h2><label class="form" style="margin:14px 0"><span style="font-size:12.5px;color:var(--brume)">À qui ?</span><input class="inp" id="pr-qui" autocapitalize="words"></label><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn petit" id="pr-non">Annuler</button><button class="btn or petit" id="pr-oui" disabled>Prêter</button></div>`, (d, f) => {
      const i = d.querySelector('#pr-qui'), ok = d.querySelector('#pr-oui'); i.focus();
      i.oninput = () => ok.disabled = !i.value.trim(); d.querySelector('#pr-non').onclick = f;
      ok.onclick = async () => { l.pretA = i.value.trim() || null; l.pretDepuis = Dates.aujourdhui(); f(); await sauver(); rendre(); };
    });
  }
  function dialogueLien(l){
    const deja = new Set(l._liens.map(x => x.id)), cands = M.lectures.filter(a => a.id !== l.id && !deja.has(a.id)).sort((a, b) => cleTitre(a) < cleTitre(b) ? -1 : 1);

    dialogue(`<h2 style="font-size:19px">Relier « ${esc(l.titre)} »</h2><p class="doux" style="font-size:13px;margin:4px 0 10px">à un autre livre de ta bibliothèque</p><input class="inp" id="li-cherche" placeholder="Chercher un titre ou un auteur"><div id="li-liste" style="max-height:38vh;overflow-y:auto;margin:8px 0"></div><input class="inp" id="li-raison" placeholder="Pourquoi ? (facultatif)"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn petit" id="li-non">Annuler</button><button class="btn or petit" id="li-oui" disabled>Relier</button></div>`, (d, f) => {
      const liste = d.querySelector('#li-liste'), ok = d.querySelector('#li-oui');
      const montrer = () => { const t = norm(d.querySelector('#li-cherche').value); liste.innerHTML = cands.filter(a => !t || norm(a.titre + ' ' + a.auteur).includes(t)).slice(0, 60).map(a => `<button class="ligne li-choix${choix === a.id ? ' choisi' : ''}" data-id="${a.id}" style="padding:6px">${couverture(a, 30)}<div class="infos"><div class="t" style="font-size:15px">${esc(a.titre)}</div><div class="a">${esc(a.auteur || '')}</div></div></button>`).join('') || '<p class="doux" style="font-size:13px">Aucun livre.</p>';

      d.querySelector('#li-cherche').oninput = montrer; montrer(); d.querySelector('#li-cherche').focus();

    });

  function editeurCitation(l, c, texteLu){
    dialogue(`<h2 style="font-size:19px">${c ? 'Modifier la citation' : 'Nouvelle citation'}</h2>${texteLu != null ? '<p class="doux" style="font-size:12.5px;margin:4px 0 0">Texte lu sur ta photo : corrige-le si besoin.</p>' : ''}<textarea class="inp" id="ci-texte" style="min-height:150px;margin-top:10px" placeholder="Le passage, sans guillemets">${esc(c ? c.texte : texteLu || '')}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><input class="inp" id="ci-page" inputmode="numeric" placeholder="Page" style="width:96px" value="${c && c.page ? c.page : ''}"><button type="button" class="btn petit" id="ci-dicter">🎙 Dicter</button></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn petit" id="ci-non">Annuler</button><button class="btn or petit" id="ci-oui">Enregistrer</button></div>`, (d, f) => {
      const t = d.querySelector('#ci-texte'); t.focus(); Dictee.brancher(d.querySelector('#ci-dicter'), t);

        if (c) { c.texte = v; c.page = p > 0 ? p : null; } else M.citations.push({ id: M.citations.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1, lectureId: l.id, texte: v, page: p > 0 ? p : null, dateAjout: Date.now() });
        f(); await sauver(); rendre(); };

  async function partager(l){
    const cs = citationsDe(l.id).slice().sort((a, b) => (a.page ?? 1e9) - (b.page ?? 1e9) || a.dateAjout - b.dateAjout);
    const lec = l.dateFin != null ? 'Lu ' + ((l.precisionDates || 0) === 0 ? 'le ' + Dates.formater(l.dateFin) : 'en ' + Dates.formaterSelon(l.dateFin, l.precisionDates)) : l.dateDebut != null ? 'Commencé le ' + Dates.formater(l.dateDebut) : LIB_STATUT[l.statut];
    let t = `## ${l.titre}${l.auteur ? ' — ' + l.auteur : ''}\n*${lec}${l.note > 0 ? ' · ' + '★'.repeat(l.note) : ''}*\n\n`;
    if (l.notes && l.notes.trim()) t += `### Notes\n${l.notes.trim()}\n\n`;
    if (cs.length) t += '### Citations\n' + cs.map(c => `> « ${c.texte.trim()} »${c.page ? ` (p. ${c.page})` : ''}\n`).join('\n');
    try { if (navigator.share) { await navigator.share({ title: 'Mes notes : ' + l.titre, text: t }); return; } } catch (e) { if (e.name === 'AbortError') return; }

  /* ---------- panneau « Modifier » (EditionFiche.kt) ---------- */
  function panneauModifier(l){
    const s = { titre: l.titre, auteur: l.auteur || '', serie: l.serie || '', tome: l.tome != null ? String(l.tome) : '', theme: l.theme || '', type: l.type || 'LIVRE', statut: l.statut, mots: l.motsCles || '', total: l.pagesTotal != null ? String(l.pagesTotal) : '', page: l.pageActuelle != null ? String(l.pageActuelle) : '', relectures: l.relectures || 0,
      precision: l.dateDebut == null && l.dateFin == null && l.statut === 'LU' ? INCONNUE : (l.precisionDates || 0), debut: l.dateDebut, fin: l.dateFin };
    const ref = l.statut === 'LU' ? l.dateFin : l.dateDebut, dref = ref != null ? new Date(ref) : null;
    s.annee = String(dref ? dref.getUTCFullYear() : new Date().getFullYear()); s.mois = dref ? dref.getUTCMonth() + 1 : new Date().getMonth() + 1;
    const fond = document.createElement('div'); fond.className = 'feuille-fond'; document.body.appendChild(fond);

          <label>Thème<input class="inp" name="theme" list="liste-themes-m" value="${esc(s.theme)}" placeholder="Choisis dans la liste ou écris le tien"></label><datalist id="liste-themes-m">${THEMES.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
          <div class="choix">${puce('type', 'LIVRE', 'Livre', s.type === 'LIVRE')}${puce('type', 'BD', 'BD', s.type === 'BD')}</div>
          <label>Mots-clés<textarea class="inp" name="mots" style="min-height:64px">${esc(s.mots)}</textarea><span class="fc-petit" style="font-weight:400">Séparés par des virgules. Ils relient les livres dans le ciel.</span></label>
          <div class="fc-lab or" style="margin-top:6px">TA LECTURE</div>

            <div class="choix">${choixP.map(([v, lib]) => puce('prec', v, lib, s.precision === v)).join('')}</div>
            ${s.precision === 0 ? `<div class="deux"><label>Début<input class="inp" type="date" name="debut" value="${Dates.versChamp(s.debut)}"></label>${s.statut === 'LU' ? `<label>Fin<input class="inp" type="date" name="fin" value="${Dates.versChamp(s.fin)}"></label>` : ''}</div>`
              : s.precision === 1 || s.precision === 2 ? `<label style="width:130px">Année<input class="inp" name="annee" inputmode="numeric" value="${esc(s.annee)}"></label>${s.precision === 1 ? `<div class="choix">${Dates.COURT.map((m, i) => puce('mois', i + 1, m, s.mois === i + 1)).join('')}</div>` : ''}`

      fond.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { lire(); s.statut = b.dataset.st; if (s.statut !== 'LU' && s.precision === INCONNUE) s.precision = 0; afficher(); });
      fond.querySelectorAll('[data-prec]').forEach(b => b.onclick = () => { lire(); s.precision = +b.dataset.prec; afficher(); });

    function construire(){

      let d, f, p;

      else if (s.precision === 0) [d, f, p] = [s.debut, s.statut === 'LU' ? s.fin : null, 0];
      else if (s.statut === 'LU') [d, f, p] = [null, approx, s.precision];
      else [d, f, p] = [approx, null, s.precision];
      const ent = v => { const n = parseInt(String(v).replace(/\D/g, ''), 10); return Number.isFinite(n) ? n : null; };
      Object.assign(l, { titre: s.titre.trim() || l.titre, auteur: s.auteur.trim(), serie: s.serie.trim() || null, tome: ent(s.tome), theme: s.theme.trim() || null, type: s.type, statut: s.statut, motsCles: s.mots.trim(),

    }
    function fermerP(){ fond.classList.remove('ouvert'); setTimeout(() => fond.remove(), 250); }
    fond.addEventListener('click', e => { if (e.target === fond) fermerP(); });
    afficher(); requestAnimationFrame(() => fond.classList.add('ouvert'));
  }

  /* ---------- ouverture ---------- */
  function ouvrir(id, maj = true){
    const l = M.parId.get(id); if (!l) return;
    if (livre?.id !== id) { page = 0; menuOuvert = false; }
    enregistrerEnCours();
    livre = l; ouverte = true; rendre(); el.querySelector('.fc-defile').scrollTop = 0; suivreTitre();
    el.classList.add('ouverte'); el.setAttribute('aria-hidden', 'false'); voile.classList.add('ouvert');
    if (maj && location.hash !== '#fiche-' + id) history.pushState(null, '', '#fiche-' + id);
    chargerSuggestions(l); auto(l);
  }
  function fermer(maj = true){
    if (!ouverte) return; enregistrerEnCours(); Dictee.arreter(); ouverte = false;
    el.classList.remove('ouverte'); el.setAttribute('aria-hidden', 'true'); voile.classList.remove('ouvert');
    if (maj && /^#fiche-/.test(location.hash)) history.pushState(null, '', '#' + (vueCourante === 'vide' ? 'ciel' : vueCourante));
  }
  voile.onclick = () => fermer();
  addEventListener('keydown', e => { if (e.key === 'Escape' && ouverte && !$('#dialogue').classList.contains('ouvert') && !document.querySelector('.feuille-fond')) fermer(); });
  addEventListener('popstate', () => { if (!/^#fiche-/.test(location.hash)) fermer(false); });
  function rafraichir(){ if (!ouverte || !livre) return; const l = M.parId.get(livre.id); if (!l) { fermer(); return; } livre = l; if (el.querySelector('.fc-defile')) rendre(); }
  function montrer(html, brancherM){ ouverte = true; el.innerHTML = html; el.classList.add('ouverte'); el.setAttribute('aria-hidden', 'false'); voile.classList.add('ouvert'); brancherM(el); }
  return { ouvrir, fermer, rafraichir, montrer, estOuverte: () => ouverte, livreId: () => livre?.id };
})();

  }
  async function valider(){
    if (!s.titre.trim()) return;
    const auj = Dates.aujourdhui(), an = parseInt(s.annee, 10), anOk = an >= 1900 && an <= 2100;
    const l = await Edition.ajouterSimple({
      titre: s.titre.trim(), auteur: s.auteur.trim(), type: s.type, statut: s.statut, isbn: s.isbn.trim() || null, couvertureUrl: s.couverture, theme: s.theme.trim() || null,

  async function ouvrir(){ await Edition.assurerRacine(); s = neuf(); photoCouv = null; afficher(); setTimeout(() => $('#aj-form')?.elements.isbn.focus(), 60); }

})();

/* =========================================================

   ========================================================= */
const Fil = {
  rendre(){

      const etat = x.enCours ? `En cours · ${Math.max(1, duree)} j${pc}` : l.dateDebut && l.dateFin ? `${Math.max(1, duree)} jour${duree > 1 ? 's' : ''}` : STATUTS[l.statut];

        return (d.items || []).map(it => { const v = it.volumeInfo || {}, ids = v.industryIdentifiers || [], img = v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail);
          const isbn = (ids.find(x => x.type === 'ISBN_13') || ids.find(x => x.type === 'ISBN_10') || {}).identifier;
          return { titre: v.title || '', sousTitre: v.subtitle, auteur: (v.authors || []).join(', '), editeur: v.publisher || '', annee: (v.publishedDate || '').slice(0, 4), isbn: isbn ? nettoyerIsbn(isbn) : null,
            pagesTotal: v.pageCount || null, couvertureUrl: img ? img.replace(/^http:/, 'https:').replace('&edge=curl', '') : null, resume: v.description || '', theme: (v.categories || []).map(themeDepuis).find(Boolean) || null, source: 'Google Books' }; });
      })(),
      (async () => {   // Open Library
        const d = await json(`https://openlibrary.org/search.json?limit=10&fields=title,author_name,first_publish_year,isbn,cover_i,number_of_pages_median,publisher&title=${encodeURIComponent(titre)}${auteur ? '&author=' + encodeURIComponent(auteur) : ''}`);
        return (d.docs || []).map(x => ({ titre: x.title || '', auteur: (x.author_name || []).slice(0, 2).join(', '), editeur: (x.publisher || [])[0] || '', annee: x.first_publish_year ? String(x.first_publish_year) : '',
          isbn: (x.isbn || []).map(nettoyerIsbn).find(i => i.length === 13) || null, pagesTotal: x.number_of_pages_median || null, couvertureUrl: x.cover_i ? `https://covers.openlibrary.org/b/id/${x.cover_i}-M.jpg` : null, resume: '', source: 'Open Library' }));
      })()
    ];
    const lots = await Promise.allSettled(taches);
    if (lots.every(l => l.status === 'rejected')) throw new Error(lots.some(l => l.reason instanceof TypeError) ? 'reseau' : 'erreur');
    for (const l of lots) if (l.status === 'fulfilled') l.value.filter(e => e.titre).forEach(ajouter);
    return res.slice(0, 25);
  }
  async function chercherIsbn(isbn){
    let res = null, bloque = 0, essais = 0; const sources = [];
    for (const f of [bnf, googleBooks, openLibrary]) {
      essais++;
      try { const r = await f(isbn); if (r) { sources.push(r.source); res = res ? { ...r, ...Object.fromEntries(Object.entries(res).filter(([, v]) => v && !(Array.isArray(v) && !v.length))) } : r; } }
      catch (e) { if (e instanceof TypeError) bloque++; console.warn(f.name, e); }
    }
    if (!res && bloque === essais) throw new Error('reseau');
    if (res) res.source = sources.join(' + ');
    return res;
  }

  async function reduireImage(fichier){
    const bmp = await createImageBitmap(fichier);
    const f = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * f); c.height = Math.round(bmp.height * f);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(ok => c.toBlob(ok, 'image/jpeg', .85));
  }

  function lireForm(f){

      el.querySelector('#e-coller').onclick = async () => {

      el.querySelector('#e-url-ok').onclick = () => { const u = el.querySelector('#e-url-image').value.trim(); if (!/^https?:\/\//.test(u)) { toast('Colle une adresse qui commence par https://'); return; } appliquerUrl(u.replace(/^http:/, 'https:')); };
      const zone = el.querySelector('#e-zone-couv');

      zone.addEventListener('dragleave', () => zone.classList.remove('survol'));

        const u = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '').split('\n')[0].trim(); if (/^https?:\/\//.test(u)) appliquerUrl(u.replace(/^http:/, 'https:')); });
      // trouver le livre d'après une photo de sa couverture

    return moteur === 'ddg' ? 'https://duckduckgo.com/?ia=images&iax=images&q=' + encodeURIComponent(q) : 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q);

    if (it) { e.preventDefault(); appliquerImage(it.getAsFile()); return; }
    const t = (e.clipboardData?.getData('text') || '').trim();
    if (/^https:\/\/\S+\.(jpe?g|png|webp|gif)(\?\S*)?$/i.test(t) && !(e.target && e.target.matches && e.target.matches('input,textarea'))) { e.preventDefault(); appliquerUrl(t); }
  });

  /* Trouver un livre d'après une photo de sa couverture : code-barres d'abord, sinon lecture du texte */
  let tesseract = null, lecteurLog = null;
  async function lecteur(T, psm){
    if (!tesseract) tesseract = await T.createWorker('fra+eng', 1, { logger: m => lecteurLog && lecteurLog(m) });
    await tesseract.setParameters({ tessedit_pageseg_mode: psm, preserve_interword_spaces: '1' });
    return tesseract;
  }
  /* Scanner la 4e de couverture : photo → recadrage sur le texte → lecture → champ « 4e de couverture » */
  async function scanner4e(fichier){
    const etat = m => { const e = $('#e-4e-etat'); if (e) e.innerHTML = m; };
    let bmp; try { bmp = await createImageBitmap(fichier); } catch (e) { etat('<span style="color:var(--corail)">Image illisible.</span>'); return; }
    // le code-barres de la 4e donne aussi l'ISBN s'il manque
    try { const codes = await Scanner.lireImage(bmp); const c = (codes[0] || '').replace(/\D/g, ''); const f = $('#e-form'); if (f && Scanner.isbnValide(c) && !f.elements.isbn.value.trim()) { f.elements.isbn.value = c; toast('ISBN lu sur le code-barres : ' + c); } } catch (e) {}
    const morceau = await Recadreur.ouvrir(bmp);   // garder seulement le texte du résumé
    if (!morceau) { etat(''); return; }
    etat('Lecture du texte… 0 %');
    try {
      const T = await chargerTesseract();
      lecteurLog = m => { if (m.status === 'recognizing text') etat(`Lecture du texte… ${Math.round(m.progress * 100)} %`); else if (/load|initializ/.test(m.status)) etat('Préparation de la lecture (la première fois, quelques secondes)…'); };
      const w = await lecteur(T, '3');   // page de texte : paragraphes
      const img = await createImageBitmap(morceau), c = document.createElement('canvas'), f2 = Math.min(2, 2000 / Math.max(img.width, img.height));
      c.width = Math.round(img.width * f2); c.height = Math.round(img.height * f2); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const r = await w.recognize(c);
      // on garde les lignes sûres et faites de lettres (pas le code-barres ni les logos), puis on recoud les paragraphes
      const lignesOk = (r.data.lines || []).map(l => ({ t: l.text.replace(/\s+/g, ' ').trim(), c: l.confidence }))
        .filter(l => l.t && l.c >= 55 && (l.t.match(/\p{L}/gu) || []).length / l.t.replace(/\s/g, '').length >= .6 && (l.t.match(/\p{L}{3,}/gu) || []).length >= 1);
      let t = '';
      for (const l of lignesOk) {
        if (!t) t = l.t;
        else if (/\p{L}-$/u.test(t) && /^\p{Ll}/u.test(l.t)) t = t.slice(0, -1) + l.t;   // mot coupé en fin de ligne
        else t += (/[.!?»…]$/.test(t) && l.t.length > 0 && /^[\p{Lu}«—-]/u.test(l.t) ? '\n\n' : ' ') + l.t;
      }
      t = t.replace(/ ([,.])/g, '$1').trim();
      if (t.replace(/[^\p{L}]/gu, '').length < 20) { etat('<span style="color:var(--or)">Pas assez de texte lisible : reprends la photo bien droite, nette et sans reflet.</span>'); return; }
      const f = $('#e-form'); if (!f) return;
      lireForm(f);
      const deja = brouillon.resume && brouillon.resume.trim();
      brouillon.resume = deja && !confirmerRemplacement() ? brouillon.resume + '\n\n' + t : t;
      brouillon.sourceResume = 'Photo de la 4e';
      afficherConserve($('#fiche'));
      const ta = $('#e-form')?.elements.resume; if (ta) { ta.scrollIntoView({ block: 'center' }); ta.style.minHeight = '220px'; }

      l.titre = r.titre ? (r.sousTitre && r.titre.length < 25 ? `${r.titre} : ${r.sousTitre}` : r.titre) : '';
      l.auteur = r.auteur || ''; l.pagesTotal = r.pagesTotal || null; l.theme = r.theme || null; l.couvertureUrl = r.couvertureUrl || null;
      if (r.resume) { l.resume = r.resume; l.sourceResume = r.source; }

  /* ---------- Compléments dans la fiche : citations, liens ---------- */
  function complement(l, onglet){
    if (onglet === 'citations') return `<div class="carte" style="margin-top:8px"><div class="sur" style="margin-bottom:8px">Nouvelle citation</div><textarea class="inp" id="c-texte" placeholder="Le passage, sans guillemets"></textarea><div style="display:flex;gap:8px;margin-top:8px"><input class="inp" id="c-page" inputmode="numeric" placeholder="Page" style="width:96px"><button type="button" class="btn petit" id="c-dicter">🎙 Dicter</button><button class="btn or" id="c-ajouter" style="margin-left:auto">Garder</button></div></div>`;
    if (onglet === 'proches') return `<div class="carte" style="margin-top:8px"><div class="sur" style="margin-bottom:8px">Relier à un autre livre</div><input class="inp" id="r-livre" list="liste-livres" placeholder="Titre du livre"><datalist id="liste-livres">${M.lectures.filter(o => o.id !== l.id).map(o => `<option value="${esc(titreCourt(o) + ' — ' + (o.auteur || '?'))}">`).join('')}</datalist><input class="inp" id="r-raison" placeholder="Pourquoi, en quelques mots" style="margin-top:8px"><div style="display:flex;margin-top:8px"><button class="btn or" id="r-ajouter" style="margin-left:auto">Relier</button></div></div>`;

  async function relierLivres(paires, raison){
    let n = 0;
    for (const [a, b] of paires) if (a !== b && !M.liens.some(x => (x.lectureA === a && x.lectureB === b) || (x.lectureA === b && x.lectureB === a))) { M.liens.push({ id: nouvelId(M.liens), lectureA: a, lectureB: b, raison: raison || '', dateAjout: Date.now() }); n++; }
    if (n) await enregistrer();

  }
  function relier(a, b, raison){
    if (a === b || M.liens.some(x => (x.lectureA === a && x.lectureB === b) || (x.lectureA === b && x.lectureB === a))) { toast('Ces deux livres sont déjà reliés'); return false; }
    M.liens.push({ id: nouvelId(M.liens), lectureA: a, lectureB: b, raison: raison || '', dateAjout: Date.now() }); return true;
  }
  function brancher(el, l, onglet){
    const apres = async msg => { await enregistrer(); Fiche.rafraichir(); if (msg) toast(msg); };
    el.querySelectorAll('[data-supcit]').forEach(b => b.onclick = () => confirmer('Supprimer cette citation ?', 'Elle disparaîtra aussi du carnet.', 'Supprimer', async () => { M.citations = M.citations.filter(c => c.id !== +b.dataset.supcit); await apres('Citation supprimée'); }));
    el.querySelectorAll('[data-delier]').forEach(b => b.onclick = async () => { const o = +b.dataset.delier; M.liens = M.liens.filter(x => !((x.lectureA === l.id && x.lectureB === o) || (x.lectureA === o && x.lectureB === l.id))); await apres('Lien retiré'); });
    el.querySelectorAll('[data-relier]').forEach(b => b.onclick = async () => { if (relier(l.id, +b.dataset.relier, b.dataset.raison)) await apres('Livres reliés'); });
